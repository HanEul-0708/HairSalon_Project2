spring.profiles.active=local
spring.datasource.url=${CATALOG_TEST_DB_URL}
spring.datasource.username=${CATALOG_TEST_DB_USER:root}
spring.datasource.password=${CATALOG_TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log=false
spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true
file.upload.path=build/catalog-test/uploads/
kakao.rest-api-key=
kakao.javascript-key=
designer.ai.openai.enabled=false
app.seed.members.enabled=false
logging.level.org.hibernate.stat=OFF
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=OFF
