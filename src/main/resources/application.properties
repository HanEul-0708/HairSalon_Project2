# 파일 인코딩 UTF-8 강제 설정
spring.mandatory-file-encoding=UTF-8
spring.application.name=HairSalonProject2

# =====================
# DB 설정
# =====================
spring.datasource.url=jdbc:mysql://localhost:3306/salon_project?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA 설정
# =====================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================
# Thymeleaf 설정
# =====================
spring.thymeleaf.cache=false

# =====================
# 파일 업로드 크기 제한
# =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# =====================              ← 여기 추가!
# 파일 저장 경로
# =====================
file.upload.path=C:/upload/

# =====================
# 서버 설정
# =====================
server.port=8080
