<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::headExtra}, ~{::main})}">
<head>
 <title th:text="${salonId != null} ? '살롱 수정' : '살롱 등록'">살롱 폼</title>
 <th:block th:fragment="headExtra">
  <link rel="stylesheet" th:href="@{/css/salon.css}">
  <script th:src="@{/js/salon.js}" defer></script>
 </th:block>
</head>
<body>
<main>
 <div class="container salon-page salon-form-page">
  <div class="page-header">
   <h1 th:text="${salonId != null} ? '살롱 수정' : '살롱 등록'">살롱 등록</h1>
   <p>살롱 기본 정보와 외부 API 연동 정보를 관리합니다.</p>
  </div>

  <th:block th:if="${salonId != null}">
   <form method="post" th:action="@{/salons/{id}/edit(id=${salonId})}" th:object="${form}" class="service-form">
	<div class="form-group">
	 <label class="form-label" for="nameEdit">살롱명</label>
	 <input id="nameEdit" class="form-control" th:field="*{name}" th:errorclass="is-invalid" maxlength="100" required aria-describedby="nameEditError" th:attr="aria-invalid=${#fields.hasErrors('name')}" placeholder="살롱명">
	 <div id="nameEditError" class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="addressEdit">주소</label>
	 <input id="addressEdit" class="form-control" th:field="*{address}" th:errorclass="is-invalid" maxlength="255" required aria-describedby="addressEditError" th:attr="aria-invalid=${#fields.hasErrors('address')}" placeholder="지번 주소">
	 <div id="addressEditError" class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="roadAddressEdit">도로명 주소</label>
	 <input id="roadAddressEdit" class="form-control" th:field="*{roadAddress}" th:errorclass="is-invalid" maxlength="255" aria-describedby="roadAddressEditError" th:attr="aria-invalid=${#fields.hasErrors('roadAddress')}" placeholder="도로명 주소">
	 <div id="roadAddressEditError" class="invalid-feedback" th:if="${#fields.hasErrors('roadAddress')}" th:errors="*{roadAddress}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="phoneEdit">전화번호</label>
	 <input id="phoneEdit" class="form-control" th:field="*{phone}" th:errorclass="is-invalid" maxlength="20" aria-describedby="phoneEditError" th:attr="aria-invalid=${#fields.hasErrors('phone')}" placeholder="전화번호">
	 <div id="phoneEditError" class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="imageUrlEdit">이미지 URL</label>
	 <input id="imageUrlEdit" class="form-control" th:field="*{imageUrl}" th:errorclass="is-invalid" maxlength="255" aria-describedby="imageUrlEditError" th:attr="aria-invalid=${#fields.hasErrors('imageUrl')}" placeholder="이미지 URL">
	 <div id="imageUrlEditError" class="invalid-feedback" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="placeUrlEdit">외부 상세 URL</label>
	 <input id="placeUrlEdit" class="form-control" th:field="*{placeUrl}" th:errorclass="is-invalid" maxlength="255" aria-describedby="placeUrlEditError" th:attr="aria-invalid=${#fields.hasErrors('placeUrl')}" placeholder="Kakao/Naver 상세 URL">
	 <div id="placeUrlEditError" class="invalid-feedback" th:if="${#fields.hasErrors('placeUrl')}" th:errors="*{placeUrl}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="descriptionEdit">소개</label>
	 <textarea id="descriptionEdit" class="form-control" th:field="*{description}" placeholder="살롱 소개"></textarea>
	</div>
	<div class="form-group">
	 <label class="form-label" for="reservableEdit">예약 가능 여부</label>
	 <select id="reservableEdit" class="form-control" th:field="*{reservable}" th:errorclass="is-invalid" required aria-describedby="reservableEditError" th:attr="aria-invalid=${#fields.hasErrors('reservable')}">
	  <option th:value="true">예약 가능</option>
	  <option th:value="false">예약 준비중</option>
	 </select>
	 <div id="reservableEditError" class="invalid-feedback" th:if="${#fields.hasErrors('reservable')}" th:errors="*{reservable}"></div>
	</div>
	<div class="form-actions">
	 <button type="submit" class="btn btn-primary">수정 저장</button>
	 <a th:href="@{/salons/{id}(id=${salonId})}" class="btn btn-outline">취소</a>
	</div>
   </form>
  </th:block>

  <th:block th:unless="${salonId != null}">
   <form method="post" th:action="@{/salons}" th:object="${form}" class="service-form">
	<div class="form-group">
	 <label class="form-label" for="sourceTypeCreate">출처</label>
	 <input id="sourceTypeCreate" class="form-control" th:field="*{sourceType}" th:errorclass="is-invalid" maxlength="30" aria-describedby="sourceTypeCreateError" th:attr="aria-invalid=${#fields.hasErrors('sourceType')}" placeholder="예: MANUAL, KAKAO">
	 <div id="sourceTypeCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('sourceType')}" th:errors="*{sourceType}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="externalIdCreate">외부 ID</label>
	 <input id="externalIdCreate" class="form-control" th:field="*{externalId}" th:errorclass="is-invalid" maxlength="100" aria-describedby="externalIdCreateError" th:attr="aria-invalid=${#fields.hasErrors('externalId')}" placeholder="외부 연동 ID">
	 <div id="externalIdCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('externalId')}" th:errors="*{externalId}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="nameCreate">살롱명</label>
	 <input id="nameCreate" class="form-control" th:field="*{name}" th:errorclass="is-invalid" maxlength="100" required aria-describedby="nameCreateError" th:attr="aria-invalid=${#fields.hasErrors('name')}" placeholder="살롱명">
	 <div id="nameCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="addressCreate">주소</label>
	 <input id="addressCreate" class="form-control" th:field="*{address}" th:errorclass="is-invalid" maxlength="255" required aria-describedby="addressCreateError" th:attr="aria-invalid=${#fields.hasErrors('address')}" placeholder="지번 주소">
	 <div id="addressCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="roadAddressCreate">도로명 주소</label>
	 <input id="roadAddressCreate" class="form-control" th:field="*{roadAddress}" th:errorclass="is-invalid" maxlength="255" aria-describedby="roadAddressCreateError" th:attr="aria-invalid=${#fields.hasErrors('roadAddress')}" placeholder="도로명 주소">
	 <div id="roadAddressCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('roadAddress')}" th:errors="*{roadAddress}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="phoneCreate">전화번호</label>
	 <input id="phoneCreate" class="form-control" th:field="*{phone}" th:errorclass="is-invalid" maxlength="20" aria-describedby="phoneCreateError" th:attr="aria-invalid=${#fields.hasErrors('phone')}" placeholder="전화번호">
	 <div id="phoneCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="imageUrlCreate">이미지 URL</label>
	 <input id="imageUrlCreate" class="form-control" th:field="*{imageUrl}" th:errorclass="is-invalid" maxlength="255" aria-describedby="imageUrlCreateError" th:attr="aria-invalid=${#fields.hasErrors('imageUrl')}" placeholder="이미지 URL">
	 <div id="imageUrlCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="placeUrlCreate">외부 상세 URL</label>
	 <input id="placeUrlCreate" class="form-control" th:field="*{placeUrl}" th:errorclass="is-invalid" maxlength="255" aria-describedby="placeUrlCreateError" th:attr="aria-invalid=${#fields.hasErrors('placeUrl')}" placeholder="Kakao/Naver 상세 URL">
	 <div id="placeUrlCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('placeUrl')}" th:errors="*{placeUrl}"></div>
	</div>
	<div class="form-group">
	 <label class="form-label" for="descriptionCreate">소개</label>
	 <textarea id="descriptionCreate" class="form-control" th:field="*{description}" placeholder="살롱 소개"></textarea>
	</div>
	<div class="form-group">
	 <label class="form-label" for="reservableCreate">예약 가능 여부</label>
	 <select id="reservableCreate" class="form-control" th:field="*{reservable}" th:errorclass="is-invalid" required aria-describedby="reservableCreateError" th:attr="aria-invalid=${#fields.hasErrors('reservable')}">
	  <option th:value="true">예약 가능</option>
	  <option th:value="false">예약 준비중</option>
	 </select>
	 <div id="reservableCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('reservable')}" th:errors="*{reservable}"></div>
	</div>
	<div class="form-actions">
	 <button type="submit" class="btn btn-primary">등록</button>
	 <a th:href="@{/salons}" class="btn btn-outline">취소</a>
	</div>
   </form>
  </th:block>
 </div>
</main>
</body>
</html>
