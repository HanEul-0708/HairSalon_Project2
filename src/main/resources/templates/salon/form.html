<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${salonId != null} ? '살롱 수정' : '살롱 등록'">살롱 폼</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/salon.css}">
    <script th:src="@{/js/common.js}" defer></script>
    <script th:src="@{/js/salon.js}" defer></script>
</head>
<body>
<main>
    <div class="container salon-page salon-form-page">
        <div class="page-header">
            <div class="container">
                <h1 th:text="${salonId != null} ? '살롱 수정' : '살롱 등록'">살롱 등록/수정</h1>
                <p>살롱 기본 정보와 위치 정보를 입력할 수 있습니다.</p>
            </div>
        </div>

        <!-- 수정용 폼 -->
        <form th:if="${salonId != null}"
              class="salon-form"
              method="post"
              th:action="@{/salons/{id}/edit(id=${salonId})}"
              th:object="${form}">

            <div class="form-group">
                <label for="nameEdit">이름</label>
                <input id="nameEdit" th:field="*{name}" placeholder="이름">
            </div>

            <div class="form-group">
                <label for="addressEdit">주소</label>
                <input id="addressEdit" th:field="*{address}" placeholder="주소">
            </div>

            <div class="form-group">
                <label for="roadAddressEdit">도로명 주소</label>
                <input id="roadAddressEdit" th:field="*{roadAddress}" placeholder="도로명 주소">
            </div>

            <div class="form-group">
                <label for="phoneEdit">전화번호</label>
                <input id="phoneEdit" th:field="*{phone}" placeholder="전화번호">
            </div>

            <div class="form-group">
                <label for="descriptionEdit">설명</label>
                <textarea id="descriptionEdit" th:field="*{description}" placeholder="설명"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="latitudeEdit">위도</label>
                    <input id="latitudeEdit" th:field="*{latitude}" placeholder="위도">
                </div>

                <div class="form-group">
                    <label for="longitudeEdit">경도</label>
                    <input id="longitudeEdit" th:field="*{longitude}" placeholder="경도">
                </div>
            </div>

            <div class="form-group">
                <label for="imageUrlEdit">대표 이미지 URL</label>
                <input id="imageUrlEdit" th:field="*{imageUrl}" placeholder="대표 이미지 URL">
            </div>

            <div class="form-group">
                <label for="placeUrlEdit">장소 URL</label>
                <input id="placeUrlEdit" th:field="*{placeUrl}" placeholder="장소 URL">
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" th:field="*{reservable}">
                    예약 가능
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">수정 완료</button>
                <a th:href="@{/salons}" class="btn btn-outline">목록으로</a>
            </div>
        </form>

        <!-- 등록용 폼 -->
        <form th:unless="${salonId != null}"
              class="salon-form"
              method="post"
              th:action="@{/salons}"
              th:object="${form}">

            <div class="form-group">
                <label for="nameCreate">이름</label>
                <input id="nameCreate" th:field="*{name}" placeholder="이름">
            </div>

            <div class="form-group">
                <label for="addressCreate">주소</label>
                <input id="addressCreate" th:field="*{address}" placeholder="주소">
            </div>

            <div class="form-group">
                <label for="roadAddressCreate">도로명 주소</label>
                <input id="roadAddressCreate" th:field="*{roadAddress}" placeholder="도로명 주소">
            </div>

            <div class="form-group">
                <label for="phoneCreate">전화번호</label>
                <input id="phoneCreate" th:field="*{phone}" placeholder="전화번호">
            </div>

            <div class="form-group">
                <label for="descriptionCreate">설명</label>
                <textarea id="descriptionCreate" th:field="*{description}" placeholder="설명"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="latitudeCreate">위도</label>
                    <input id="latitudeCreate" th:field="*{latitude}" placeholder="위도">
                </div>

                <div class="form-group">
                    <label for="longitudeCreate">경도</label>
                    <input id="longitudeCreate" th:field="*{longitude}" placeholder="경도">
                </div>
            </div>

            <div class="form-group">
                <label for="imageUrlCreate">대표 이미지 URL</label>
                <input id="imageUrlCreate" th:field="*{imageUrl}" placeholder="대표 이미지 URL">
            </div>

            <div class="form-group">
                <label for="placeUrlCreate">장소 URL</label>
                <input id="placeUrlCreate" th:field="*{placeUrl}" placeholder="장소 URL">
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" th:field="*{reservable}">
                    예약 가능
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">저장</button>
                <a th:href="@{/salons}" class="btn btn-outline">목록으로</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
