<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>살롱 폼</title></head>
<body>
<h1>살롱 등록/수정</h1>
<form method="post" th:action="${salonId != null} ? @{/salons/{id}/edit(id=${salonId})} : @{/salons}" th:object="${form}">
    <div><input th:field="*{name}" placeholder="이름"></div>
    <div><input th:field="*{address}" placeholder="주소"></div>
    <div><input th:field="*{roadAddress}" placeholder="도로명 주소"></div>
    <div><input th:field="*{phone}" placeholder="전화번호"></div>
    <div><textarea th:field="*{description}" placeholder="설명"></textarea></div>
    <div><input th:field="*{latitude}" placeholder="위도"></div>
    <div><input th:field="*{longitude}" placeholder="경도"></div>
    <div><input th:field="*{imageUrl}" placeholder="대표 이미지 URL"></div>
    <div><input th:field="*{placeUrl}" placeholder="장소 URL"></div>
    <div><label><input type="checkbox" th:field="*{reservable}">예약 가능</label></div>
    <button type="submit">저장</button>
</form>
</body>
</html>
