<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
 <meta charset="UTF-8">
 <title>미용실 지도 검색</title>
 <link rel="stylesheet" th:href="@{/css/salon.css}">
 <script th:if="${kakaoJavascriptKey != null and !kakaoJavascriptKey.isBlank()}" th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoJavascriptKey}&libraries=services|"></script>
 <script th:src="@{/js/salon-map.js}" defer></script>
</head>
<body>
<main>
 <div class="container salon-page salon-map-page">
  <div class="catalog-hero">
   <p class="catalog-hero__eyebrow">Salon Map Search</p>
   <h1 class="catalog-hero__title">미용실 지도 검색</h1>
   <p class="catalog-hero__subtitle">지역과 키워드를 입력해서 카카오 지도에서 미용실 위치를 바로 확인하세요.</p>
  </div>

  <div class="salon-map-page__layout" th:attr="data-keyword=${keyword},data-region=${region},data-has-key=${kakaoJavascriptKey != null and !kakaoJavascriptKey.isBlank()},data-has-rest-key=${kakaoRestApiKey != null and !kakaoRestApiKey.isBlank()}">
   <section class="salon-map-panel">
	<form class="salon-search-form salon-search-form--primary salon-search-form--map" onsubmit="return false;">
	 <div class="salon-search-form__intro">
	  <p class="salon-search-form__eyebrow">Salon Map Search</p>
	  <h2>지역과 키워드로 미용실을 검색하세요.</h2>
	  <p>검색 결과를 목록으로 확인하고, 지도에서 위치를 바로 확인할 수 있습니다.</p>
	 </div>

	 <div class="salon-search-form__controls">
	  <div class="salon-search-form__fields">
	   <div>
		<label class="sr-only" for="mapRegion">지역</label>
		<input id="mapRegion" type="text" placeholder="예: 부산 수영구" th:value="${region}">
	   </div>

	   <div>
		<label class="sr-only" for="mapKeyword">키워드</label>
		<input id="mapKeyword" type="text" placeholder="예: 준오헤어" th:value="${keyword}">
	   </div>
	  </div>

	  <div class="salon-search-form__actions">
	   <button type="button" class="btn btn-primary" id="mapSearchButton">지도 검색</button>
	   <button type="button" class="btn btn-outline" id="mapResetButton">초기화</button>
	  </div>
	 </div>
	</form>

	<div class="salon-map-notice" id="mapNotice" th:hidden="${kakaoJavascriptKey != null and !kakaoJavascriptKey.isBlank()}">
	 카카오 JavaScript 키가 없어서 지도 검색을 사용할 수 없습니다.
	</div>

	<div class="salon-map-results" id="mapResults">
	 <div class="salon-map-results__empty">
	  검색 결과가 여기에 표시됩니다.
	 </div>
	</div>
   </section>

   <section class="salon-map-canvas-wrap">
	<div id="salonMapCanvas" class="salon-map-canvas" aria-label="미용실 지도"></div>
   </section>
  </div>
 </div>
</main>
</body>
</html>
