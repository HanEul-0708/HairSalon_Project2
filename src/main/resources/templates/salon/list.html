<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>살롱 목록</title>
    <link rel="stylesheet" th:href="@{/css/salon.css}">
    <script th:src="@{/js/salon.js}" defer></script>
</head>
<body>
<main>
    <div class="container salon-page salon-list-page">
        <div class="page-header">
            <h1>살롱 목록</h1>
            <p>이름, 지역, 평점, 거리 조건으로 살롱을 검색하고 비교할 수 있습니다.</p>
        </div>

        <div class="alert alert-info" th:if="${message}" th:text="${message}">안내 메시지</div>

        <form method="get" th:action="@{/salons}" class="salon-search-form">
            <input type="text" name="keyword" placeholder="이름, 주소, 설명" th:value="${search.keyword}">
            <input type="text" name="region" placeholder="지역" th:value="${search.region}">
            <input type="number" step="0.1" name="minRating" placeholder="최소 평점" th:value="${search.minRating}">
            <label class="salon-search-check">
                <input type="checkbox" name="reservable" value="true"
                       th:checked="${search.reservable != null and search.reservable}">
                예약 가능만 보기
            </label>
            <input type="number" step="0.000001" name="latitude" placeholder="위도" th:value="${search.latitude}">
            <input type="number" step="0.000001" name="longitude" placeholder="경도" th:value="${search.longitude}">
            <input type="number" step="0.1" name="radiusKm" placeholder="반경(km)" th:value="${search.radiusKm}">
            <select name="sort">
                <option value="recommended" th:selected="${search.sort == 'recommended'}">추천순</option>
                <option value="distance" th:selected="${search.sort == 'distance'}">거리순</option>
                <option value="rating" th:selected="${search.sort == 'rating'}">평점순</option>
                <option value="likes" th:selected="${search.sort == 'likes'}">좋아요순</option>
            </select>
            <button type="submit" class="btn btn-primary">검색</button>
        </form>

        <div class="page-actions">
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/salons/new}" class="btn btn-outline">살롱 등록</a>
        </div>

        <form method="post"
              th:action="@{/salons/sync/kakao}"
              sec:authorize="hasRole('ADMIN')"
              class="salon-search-form">
            <input type="text" name="keyword" placeholder="카카오 검색어">
            <input type="text" name="region" placeholder="지역">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <button type="submit" class="btn btn-outline">Kakao API 동기화</button>
        </form>

        <div class="empty-state" th:if="${#lists.isEmpty(salons)}">
            <p>조건에 맞는 살롱이 없습니다.</p>
        </div>

        <div class="salon-grid" th:unless="${#lists.isEmpty(salons)}">
            <div class="salon-card" th:each="salon : ${salons}">
                <div class="salon-card__image"
                     th:text="${salon.imageUrl != null and !#strings.isEmpty(salon.imageUrl) ? 'IMAGE' : 'SALON'}">
                    SALON
                </div>

                <div class="salon-card__body">
                    <div class="salon-card__title-row">
                        <h2 class="salon-card__name">
                            <a th:href="@{/salons/{id}(id=${salon.salonId})}" th:text="${salon.name}">살롱명</a>
                        </h2>
                        <span class="salon-status-badge salon-status-badge--on"
                              th:if="${salon.reservable}">예약 가능</span>
                        <span class="salon-status-badge salon-status-badge--off"
                              th:unless="${salon.reservable}">예약 준비중</span>
                    </div>

                    <p class="salon-card__meta" th:text="${salon.address}">주소</p>
                    <p class="salon-card__meta"
                       th:text="|평점 ${salon.averageRating} / 리뷰 ${salon.reviewCount} / 좋아요 ${salon.likeCount}|">
                        통계
                    </p>
                    <p class="salon-card__desc"
                       th:text="${salon.distanceKm != null ? salon.distanceKm + ' km' : '거리 정보 없음'}">
                        거리 정보
                    </p>

                    <div class="salon-card__footer">
                        <a class="btn btn-outline" th:href="@{/salons/{id}(id=${salon.salonId})}">상세 보기</a>
                        <a class="btn btn-primary"
                           th:href="@{/salons/{id}(id=${salon.salonId})}"
                           th:text="${salon.reservable} ? '예약 페이지' : '살롱 보기'">
                            상세 보기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
