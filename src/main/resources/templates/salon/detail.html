<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>살롱 상세</title></head>
<body>
<h1 th:text="${salon.name}">살롱명</h1>
<p th:text="${salon.address}">주소</p>
<p th:text="${salon.roadAddress}">도로명</p>
<p th:text="${salon.phone}">전화</p>
<p th:text="${salon.description}">설명</p>
<p th:text="|평점 ${salon.averageRating} / 리뷰 ${salon.reviewCount} / 좋아요 ${salon.likeCount}|">통계</p>
<p th:if="${salon.placeUrl != null}"><a th:href="${salon.placeUrl}" target="_blank">카카오 장소 링크</a></p>

<form method="post" th:action="@{/salons/{id}/likes(id=${salon.salonId})}">
    <button type="submit">찜하기</button>
</form>
<form method="post" th:action="@{/salons/{id}/likes(id=${salon.salonId})}">
    <input type="hidden" name="_method" value="delete">
    <button type="submit">찜 취소</button>
</form>

<p><a th:href="@{/salons/{id}/edit(id=${salon.salonId})}">수정</a></p>
<form method="post" th:action="@{/salons/{id}(id=${salon.salonId})}">
    <input type="hidden" name="_method" value="delete">
    <button type="submit">삭제</button>
</form>

<h2>디자이너</h2>
<ul>
    <li th:each="designer : ${salon.designers}">
        <a th:href="@{/designers/{id}(id=${designer.designerId})}" th:text="${designer.name}">디자이너</a>
    </li>
</ul>

<h2>시술</h2>
<ul>
    <li th:each="service : ${salon.services}">
        <a th:href="@{/salon-services/{id}(id=${service.serviceId})}" th:text="${service.name}">시술</a>
        <span th:text="| - ${service.price}원 / ${service.duration}분|">가격</span>
    </li>
</ul>
</body>
</html>
