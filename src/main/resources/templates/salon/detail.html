<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>미용실 상세</title>
    <link rel="stylesheet" th:href="@{/css/salon.css}">
    <script th:src="@{/js/salon.js}" defer></script>
</head>
<body>
<main>
<div class="container salon-page salon-detail-page">
    <div th:replace="~{fragments/message :: flashMessage}"></div>

    <div class="catalog-hero">
        <p class="catalog-hero__eyebrow">Salon Detail</p>
        <h1 class="catalog-hero__title" th:text="${salon.name}">미용실명</h1>
        <p class="catalog-hero__subtitle">미용실 정보와 디자이너, 시술 구성을 한 화면에서 확인하고 바로 예약까지 이어갈 수 있습니다.</p>
    </div>

    <div class="salon-detail">
        <section class="salon-detail__main">
            <div class="salon-detail__image"></div>

            <div class="salon-detail__headline">
                <div>
                    <p class="salon-detail__eyebrow">Salon Overview</p>
                    <h2 th:text="${salon.name}">미용실명</h2>
                </div>
                <span class="salon-status-badge salon-status-badge--on"
                      th:if="${salon.reservable}">예약 가능</span>
                <span class="salon-status-badge salon-status-badge--off"
                      th:unless="${salon.reservable}">예약 준비중</span>
            </div>

            <div class="salon-info-list">
                <div class="salon-info-item">
                    <strong>주소</strong>
                    <span th:text="${salon.address}">주소</span>
                </div>
                <div class="salon-info-item">
                    <strong>도로명</strong>
                    <span th:text="${salon.roadAddress}">도로명</span>
                </div>
                <div class="salon-info-item">
                    <strong>전화</strong>
                    <span th:text="${salon.phone}">전화번호</span>
                </div>
                <div class="salon-info-item">
                    <strong>설명</strong>
                    <span th:text="${salon.description}">설명</span>
                </div>
                <div class="salon-info-item">
                    <strong>통계</strong>
                    <span th:text="|평점 ${salon.averageRating} / 리뷰 ${salon.reviewCount} / 좋아요 ${salon.likeCount}|">통계</span>
                </div>
                <div class="salon-info-item" th:if="${salon.placeUrl != null}">
                    <strong>외부 링크</strong>
                    <a th:href="${salon.placeUrl}" target="_blank" rel="noopener">카카오 장소 페이지</a>
                </div>
            </div>

            <div class="salon-detail__actions">
                <a th:if="${salon.reservable and !#lists.isEmpty(salon.designers) and !#lists.isEmpty(salon.services)}"
                   th:href="@{/reservations/new(salonId=${salon.salonId})}"
                   class="btn btn-primary">예약하기</a>

                <button type="button"
                        class="btn btn-outline"
                        th:unless="${salon.reservable and !#lists.isEmpty(salon.designers) and !#lists.isEmpty(salon.services)}"
                        disabled>예약 준비중</button>

                <form method="post"
                      th:if="${#authorization.expression('isAuthenticated()') and !likedByCurrentUser}"
                      th:action="@{/salons/{id}/likes(id=${salon.salonId})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-primary">좋아요</button>
                </form>

                <form method="post"
                      th:if="${#authorization.expression('isAuthenticated()') and likedByCurrentUser}"
                      th:action="@{/salons/{id}/likes(id=${salon.salonId})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="_method" value="delete">
                    <button type="submit" class="btn btn-outline">좋아요 취소</button>
                </form>

                <a th:if="${#authorization.expression('isAnonymous()')}"
                   th:href="@{/members/login}"
                   class="btn btn-primary">좋아요</a>

                <a th:href="@{/salons/{id}/edit(id=${salon.salonId})}"
                   class="btn btn-outline"
                   sec:authorize="hasRole('ADMIN')">수정</a>

                <form method="post"
                      th:action="@{/salons/{id}(id=${salon.salonId})}"
                      sec:authorize="hasRole('ADMIN')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="_method" value="delete">
                    <button type="submit" class="btn btn-outline">삭제</button>
                </form>
            </div>
        </section>

        <aside class="salon-detail__side">
            <section class="salon-detail__panel">
                <p class="salon-detail__eyebrow">Designers</p>
                <h3>소속 디자이너</h3>
                <div class="salon-designer-list">
                    <div class="salon-designer-item" th:each="designer : ${salon.designers}">
                        <a th:href="@{/designers/{id}(id=${designer.designerId})}"
                           th:text="${designer.name}">디자이너</a>
                    </div>
                    <p th:if="${#lists.isEmpty(salon.designers)}">등록된 디자이너가 없습니다.</p>
                </div>
            </section>

            <section class="salon-detail__panel">
                <p class="salon-detail__eyebrow">Services</p>
                <h3>제공 시술</h3>
                <div class="salon-service-list">
                    <div class="salon-service-item" th:each="service : ${salon.services}">
                        <a th:href="@{/salon-services/{id}(id=${service.serviceId})}"
                           th:text="${service.name}">시술</a>
                        <p th:text="|${service.price}원 / ${service.duration}분|">가격</p>
                    </div>
                    <p th:if="${#lists.isEmpty(salon.services)}">등록된 시술이 없습니다.</p>
                </div>
            </section>
        </aside>
    </div>
</div>
</main>
</body>
</html>
