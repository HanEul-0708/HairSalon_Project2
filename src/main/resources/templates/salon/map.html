<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::headExtra}, ~{::main})}">
<title th:text="${pageTitle} ?: '지도에서 미용실 보기'">지도에서 미용실 보기</title>
<th:block th:fragment="headExtra">
    <link rel="stylesheet" th:href="@{/css/salon.css}">
    <script th:if="${kakaoMapConfigured}"
            th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoJavascriptKey}&autoload=false|"
            defer></script>
    <script th:src="@{/js/salon.js}" defer></script>
</th:block>
<main>
    <div class="container salon-page salon-map-page">
        <div class="page-header">
            <h1 th:text="${pageTitle} ?: '지도에서 미용실 보기'">지도에서 미용실 보기</h1>
            <p th:text="${pageDescription} ?: '좌표가 등록된 미용실을 지도와 목록에서 함께 확인합니다.'">
                좌표가 등록된 미용실을 지도와 목록에서 함께 확인합니다.
            </p>
        </div>

        <div class="alert alert-info" th:if="${message}" th:text="${message}">안내 메시지</div>

        <form method="get" th:action="@{/salons/map}" class="salon-search-form">
            <input type="text" name="keyword" placeholder="이름, 주소, 설명" th:value="${search.keyword}">
            <input type="text" name="region" placeholder="지역" th:value="${search.region}">
            <input type="number" step="0.1" name="minRating" placeholder="최소 평점" th:value="${search.minRating}">
            <label class="salon-search-check">
                <input type="checkbox" name="reservable" value="true"
                       th:checked="${search.reservable != null and search.reservable}">
                예약 가능만 보기
            </label>
            <input type="number" step="0.000001" name="latitude" placeholder="위도" th:value="${search.latitude}">
            <input type="number" step="0.000001" name="longitude" placeholder="경도" th:value="${search.longitude}">
            <input type="number" step="0.1" name="radiusKm" placeholder="반경(km)" th:value="${search.radiusKm}">
            <select name="sort">
                <option value="recommended" th:selected="${search.sort == 'recommended' or search.sort == null}">추천순</option>
                <option value="distance" th:selected="${search.sort == 'distance'}">거리순</option>
                <option value="rating" th:selected="${search.sort == 'rating'}">평점순</option>
                <option value="likes" th:selected="${search.sort == 'likes'}">좋아요순</option>
            </select>
            <button type="submit" class="btn btn-primary">지도 검색</button>
        </form>

        <div class="page-actions">
            <a th:href="@{/salons}" class="btn btn-outline">목록 보기</a>
            <a th:href="@{/salons/nearby}" class="btn btn-outline">가까운 미용실 찾기</a>
            <a th:href="@{/salons/top-rated}" class="btn btn-outline">평점 4점 이상</a>
            <a th:href="@{/salons/recommend-by-service}" class="btn btn-outline">스타일 키워드 추천</a>
            <a th:href="@{/salons/kakao-search}" class="btn btn-outline">카카오 검색</a>
        </div>

        <div class="salon-map-layout">
            <section class="salon-map-panel">
                <div id="salon-map"
                     class="salon-map-canvas"
                     th:attr="data-center-latitude=${mapCenterLatitude},
                              data-center-longitude=${mapCenterLongitude},
                              data-default-zoom=${mapDefaultZoom},
                              data-kakao-enabled=${kakaoMapConfigured}">
                </div>
                <p class="salon-map-status" data-map-status>
                    카카오 지도에서 좌표가 등록된 미용실만 표시됩니다.
                </p>
            </section>

            <section class="salon-map-sidebar">
                <div class="empty-state" th:if="${#lists.isEmpty(salons)}">
                    <p>지도에 표시할 미용실이 없습니다.</p>
                </div>

                <div class="salon-map-list" th:unless="${#lists.isEmpty(salons)}">
                    <article class="salon-map-card js-salon-marker"
                             th:each="salon : ${salons}"
                             th:attr="data-salon-id=${salon.salonId},
                                      data-latitude=${salon.latitude},
                                      data-longitude=${salon.longitude},
                                      data-name=${salon.name},
                                      data-address=${salon.address},
                                      data-detail-url=@{/salons/{id}(id=${salon.salonId})},
                                      data-distance=${salon.distanceKm},
                                      data-rating=${salon.averageRating}">
                        <div class="salon-map-card__content">
                            <div class="salon-card__title-row">
                                <h2 class="salon-card__name" th:text="${salon.name}">미용실명</h2>
                                <span class="salon-status-badge salon-status-badge--on"
                                      th:if="${salon.reservable}">예약 가능</span>
                                <span class="salon-status-badge salon-status-badge--off"
                                      th:unless="${salon.reservable}">예약 준비중</span>
                            </div>
                            <p class="salon-card__meta" th:text="${salon.address}">주소</p>
                            <p class="salon-card__meta"
                               th:text="|평점 ${salon.averageRating} / 리뷰 ${salon.reviewCount} / 좋아요 ${salon.likeCount}|">
                                평점 / 리뷰 / 좋아요
                            </p>
                            <p class="salon-card__desc"
                               th:text="${salon.distanceKm != null ? salon.distanceKm + ' km' : '거리 정보 없음'}">
                                거리 정보
                            </p>
                        </div>
                        <div class="salon-map-card__actions">
                            <a class="btn btn-outline" th:href="@{/salons/{id}(id=${salon.salonId})}">상세 보기</a>
                            <a class="btn btn-primary"
                               th:if="${salon.phone != null and !#strings.isEmpty(salon.phone)}"
                               th:href="'tel:' + ${salon.phone}">전화하기</a>
                        </div>
                    </article>
                </div>
            </section>
        </div>
    </div>
</main>
</html>
