<!--
    layout.html — 전체 페이지 공통 틀
    =====================================================
    모든 페이지가 이 파일을 틀로 사용한다.
    각 페이지는 title 과 content 조각만 끼워 넣으면 끝.

    사용법 (다른 HTML 파일에서):
    ┌─────────────────────────────────────────────────────┐
    │ <html th:replace="~{layout/layout                   │
    │     :: layout(~{::title}, ~{::main})}">             │
    │ <title>페이지 제목</title>                           │
    │ <main>                                              │
    │     이 페이지만의 내용 작성                           │
    │ </main>                                             │
    │ </html>                                             │
    └─────────────────────────────────────────────────────┘
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">

<!--
    th:fragment="layout(title, content)"
    → 이 블록 전체가 "layout" 이라는 이름의 조각이 됨
    → title  : 각 페이지 <title> 태그
    → content: 각 페이지 <main> 태그
-->
<th:block th:fragment="layout(title, headExtra, content)">
    <!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
          lang="ko">
    <head>
        <meta charset="UTF-8">
        <!-- 모바일 반응형 필수 — 없으면 모바일에서 화면 깨짐 -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- 각 페이지 title 삽입 자리 -->
        <th:block th:replace="${title}"></th:block>

        <!--
            Bootstrap 5 CSS
            그리드 / 버튼 / 폼 / 유틸리티 클래스 제공
            common.css 보다 먼저 로드해야 덮어쓰기 가능
        -->
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

        <!--
            Bootstrap Icons
            메뉴 아이콘, 버튼 아이콘 등에 사용
            예) <i class="bi bi-person"></i>
        -->
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

        <!-- 전체 공통 CSS — 골드 럭셔리 테마 -->
        <link rel="stylesheet" th:href="@{/css/common.css}">
    </head>
    <body>

    <!--
        공통 헤더
        layout/header.html 의 header 조각을 불러옴
    -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!--
        메인 컨텐츠 영역
        각 페이지의 <main> 내용이 여기에 삽입됨
    -->
    <th:block th:replace="${content}"></th:block>

    <!--
        공통 푸터
        layout/footer.html 의 footer 조각을 불러옴
    -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!--
        Bootstrap 5 JS
        드롭다운 / 모달 / 햄버거 메뉴 동작에 필요
        body 맨 아래에 두어야 페이지 로딩 속도 빠름
    -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!--
        jQuery
        Summernote 에디터 의존성
        Bootstrap JS 다음에 로드
    -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>

    <!--
        공통 JS
        모바일 메뉴 열기/닫기 등 전역 동작 담당
    -->
    <script th:src="@{/js/common.js}"></script>

    </body>
    </html>
</th:block>

</html>
