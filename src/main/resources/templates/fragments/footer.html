<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>공통 푸터</title>
</head>
<body>

<!--
    footer.html — 공통 푸터 조각 (골드 럭셔리 테마 최종본)
    =========================================================
    구성
    - 골드 상단 라인
    - 왼쪽: 브랜드 소개
    - 오른쪽: 서비스 / 탐색 / 고객지원 링크
    - 하단: 저작권

    사용법
    <footer th:replace="~{layout/footer :: footer}"></footer>
-->
<footer th:fragment="footer" class="site-footer">

    <!-- 골드 상단 강조 라인 -->
    <div class="footer__gold-bar"></div>

    <div class="footer__inner">

        <!-- ── 왼쪽: 브랜드 영역 ── -->
        <div class="footer-brand">

            <!--
                로고 영역
                나중에 로고 이미지 완성되면 아래 주석 해제하고
                .footer-brand__logo 블록 삭제
            -->
            <!--
            <img th:src="@{/images/logo-white.png}"
                 alt="HairSalon"
                 class="footer-brand__img">
            -->

            <!-- 임시 텍스트 로고 -->
            <div class="footer-brand__logo">HS</div>

            <div class="footer-brand__text">
                <strong>HairSalon Project</strong>
                <p>
                    미용실 탐색, 가격 비교, 리뷰 확인,<br>
                    예약까지 한 곳에서 이어지는<br>
                    프리미엄 헤어 플랫폼
                </p>
            </div>
        </div>

        <!-- ── 오른쪽: 링크 그룹 ── -->
        <div class="footer-links">

            <div class="footer-links__group">
                <h4>서비스</h4>
                <a th:href="@{/salons}">미용실 찾기</a>
                <a th:href="@{/designers}">디자이너</a>
                <a th:href="@{/salon-services}">시술 안내</a>
                <a th:href="@{/reservations/new}">예약하기</a>
            </div>

            <div class="footer-links__group">
                <h4>탐색</h4>
                <a th:href="@{/salons/nearby}">가까운 미용실 찾기</a>
                <a th:href="@{/salons/price-compare}">가격 비교</a>
                <a th:href="@{/salons/recommend-by-service}">시술별 추천</a>
                <a th:href="@{/salons/kakao-search}">카카오 검색</a>
            </div>

            <div class="footer-links__group">
                <h4>고객지원</h4>
                <a th:href="@{/boards/notices}">공지사항</a>
                <a th:href="@{/boards/qna}">문의게시판</a>
                <!-- 로그인한 사람에게만 보임 -->
                <a th:href="@{/members/me}"
                   sec:authorize="isAuthenticated()">마이페이지</a>
                <!-- 비로그인인 사람에게만 보임 -->
                <a th:href="@{/members/login}"
                   sec:authorize="isAnonymous()">로그인</a>
                <!-- 관리자에게만 보임 -->
                <a th:href="@{/admin}"
                   sec:authorize="hasRole('ADMIN')">관리자</a>
            </div>

        </div>
    </div>

    <!-- 저작권 하단 -->
    <div class="footer__bottom">
        <p>© 2026 HairSalon Project. All rights reserved.</p>
        <p>Team Project · Premium Hair Booking Experience</p>
    </div>

</footer>

</body>
</html>
