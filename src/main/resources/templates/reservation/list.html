<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 예약 목록</title>
    <link rel="stylesheet" th:href="@{/css/reservation.css}">
    <script th:src="@{/js/reservation.js}" defer></script>
</head>
<body>
<main>
    <div class="container reservation-page reservation-list-page">
        <div class="page-header">
            <h1 class="page-title">내 예약 목록</h1>
            <p class="page-desc">예약 변경, 취소, 리뷰 작성까지 한 곳에서 관리할 수 있습니다.</p>
        </div>

        <div class="reservation-list" th:if="${!#lists.isEmpty(reservations)}">
            <div class="reservation-card" th:each="reservation : ${reservations}">
                <div class="reservation-info">
                    <p>
                        <strong>예약 일시</strong>
                        <span th:text="${reservation.reservationDate + ' ' + reservation.reservationTime}">2026-04-06 14:00</span>
                    </p>
                    <p>
                        <strong>디자이너</strong>
                        <span th:text="${reservation.designerName}">디자이너명</span>
                    </p>
                    <p>
                        <strong>시술명</strong>
                        <span th:text="${reservation.serviceName}">시술명</span>
                    </p>
                    <p>
                        <strong>결제 금액</strong>
                        <span th:text="${#numbers.formatInteger(reservation.totalPrice, 3, 'COMMA') + '원'}">30,000원</span>
                    </p>
                    <p>
                        <strong>결제 수단</strong>
                        <span th:text="${reservation.paymentMethodLabel}">카드</span>
                    </p>
                    <p>
                        <strong>상태</strong>
                        <span class="status"
                              th:classappend="${reservation.status.name() == 'RESERVED' ? ' confirmed' : (reservation.status.name() == 'COMPLETED' ? ' done' : ' canceled')}"
                              th:text="${reservation.status.name() == 'RESERVED' ? '예약완료' : (reservation.status.name() == 'COMPLETED' ? '방문완료' : '예약취소')}">
                            예약완료
                        </span>
                    </p>
                </div>

                <div class="reservation-actions">
                    <a th:if="${reservation.status.name() == 'RESERVED' and !reviewedReservationIds.contains(reservation.reservationId)}"
                       th:href="@{/reservations/{reservationId}/edit(reservationId=${reservation.reservationId})}"
                       class="btn btn-outline">예약 변경</a>
                    <button th:if="${reservation.status.name() == 'RESERVED' and !reviewedReservationIds.contains(reservation.reservationId)}"
                            type="button"
                            class="btn btn-danger"
                            data-reservation-cancel
                            th:attr="data-reservation-id=${reservation.reservationId}">예약 취소</button>
                    <a th:if="${reviewableReservationMap[reservation.reservationId] and !reviewedReservationIds.contains(reservation.reservationId)}"
                       th:href="@{/reviews/write(reservationId=${reservation.reservationId})}"
                       class="btn btn-primary">리뷰 작성</a>
                    <span th:if="${reviewableReservationMap[reservation.reservationId] and reviewedReservationIds.contains(reservation.reservationId)}"
                          class="btn btn-review-complete">리뷰 작성 완료</span>
                    <span th:if="${reservation.status.name() == 'RESERVED' and !reviewableReservationMap[reservation.reservationId] and !reviewedReservationIds.contains(reservation.reservationId)}"
                          class="btn btn-outline">방문 후 리뷰 작성 가능</span>
                    <span th:if="${reservation.status.name() == 'CANCELLED'}"
                          class="btn btn-outline">취소된 예약</span>
                    <p class="reservation-created-at"
                       th:if="${reservation.createdAt != null}"
                       th:text="${#temporals.format(reservation.createdAt, 'yyyy.MM.dd HH:mm')}">2026.04.18 17:42</p>
                </div>
            </div>
        </div>

        <div class="pagination" th:if="${totalPages > 1}">
            <a class="page-link"
               th:classappend="${currentPage == 1 ? ' disabled' : ''}"
               th:href="@{/reservations(page=${currentPage > 1 ? currentPage - 1 : 1})}">이전</a>
            <a class="page-link"
               th:each="pageNumber : ${pageNumbers}"
               th:classappend="${pageNumber == currentPage ? ' active' : ''}"
               th:href="@{/reservations(page=${pageNumber})}"
               th:text="${pageNumber}">1</a>
            <a class="page-link"
               th:classappend="${currentPage == totalPages ? ' disabled' : ''}"
               th:href="@{/reservations(page=${currentPage < totalPages ? currentPage + 1 : totalPages})}">다음</a>
        </div>

        <div class="review-empty" th:if="${#lists.isEmpty(reservations)}">
            <p>아직 예약 내역이 없습니다.</p>
            <a href="/reservations/new" class="btn btn-primary">예약하러 가기</a>
        </div>
    </div>
</main>
</body>
</html>
