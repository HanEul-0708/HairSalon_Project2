<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약하기</title>
    <link rel="stylesheet" th:href="@{/css/reservation.css}">
    <script th:src="@{/js/reservation.js}" defer></script>
</head>
<body>
<main>
<div class="container">
    <div class="page-header">
        <h1 class="page-title">예약하기</h1>
        <p class="page-desc">디자이너와 시술, 날짜와 시간을 선택하여 예약할 수 있습니다.</p>
    </div>

    <form id="reservationForm" class="reservation-form" sec:authorize="isAuthenticated()">
        <input type="hidden" id="memberId" th:value="${#authentication.name}">
        <input type="hidden" id="totalPrice" value="0">

        <div class="form-group">
            <label for="designerId">디자이너</label>
            <select id="designerId" name="designerId" required>
                <option value="">디자이너를 선택하세요</option>
                <option th:each="designer : ${designers}" th:value="${designer.designerId}" th:text="${designer.name}">디자이너명</option>
            </select>
        </div>

        <div class="form-group">
            <label for="salonServiceId">시술명</label>
            <select id="salonServiceId" name="salonServiceId" required>
                <option value="">시술을 선택하세요</option>
                <option th:each="service : ${services}" th:value="${service.serviceId}" th:attr="data-price=${service.price}" th:text="|${service.name} (${service.price}원)|">시술명</option>
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="reservationDate">예약 날짜</label>
                <input type="date" id="reservationDate" name="reservationDate" required>
            </div>
            <div class="form-group">
                <label for="reservationTime">예약 시간</label>
                <input type="time" id="reservationTime" name="reservationTime" required>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">예약하기</button>
            <a href="/reservations" class="btn btn-outline">목록으로</a>
        </div>
    </form>

    <div sec:authorize="!isAuthenticated()">
        <p>예약하려면 로그인이 필요합니다.</p>
        <a href="/members/login" class="btn btn-primary">로그인하러 가기</a>
    </div>
</div>
</main>
</body>
</html>
