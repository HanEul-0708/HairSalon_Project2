<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 생성</title>
    <link rel="stylesheet" th:href="@{/css/reservation.css}">
    <script th:src="@{/js/reservation.js}" defer></script>
</head>
<body>
<main>
    <div class="container reservation-page reservation-form-page">
        <div class="page-header">
            <h1 class="page-title">예약 생성</h1>
            <p class="page-desc">디자이너, 시술, 날짜와 시간을 선택해 예약을 등록하세요.</p>
        </div>

        <form id="reservationForm" class="reservation-form">
            <input type="hidden" id="memberId" th:value="${currentMemberId}">

            <div class="form-row">
                <div class="form-group">
                    <label for="designerId">디자이너</label>
                    <select id="designerId" name="designerId" required>
                        <option value="">디자이너를 선택하세요</option>
                        <option th:each="designer : ${designers}"
                                th:value="${designer.designerId}"
                                th:text="${designer.name}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="salonServiceId">시술</label>
                    <select id="salonServiceId" name="salonServiceId" required>
                        <option value="">시술을 선택하세요</option>
                        <option th:each="service : ${services}"
                                th:value="${service.serviceId}"
                                th:text="${service.name + ' / ' + #numbers.formatInteger(service.price, 3, 'COMMA') + '원'}"
                                th:attr="data-price=${service.price}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="reservationDate">예약 날짜</label>
                    <input type="date" id="reservationDate" name="reservationDate" required>
                </div>

                <div class="form-group">
                    <label for="reservationTime">예약 시간</label>
                    <input type="time" id="reservationTime" name="reservationTime" required>
                </div>
            </div>

            <div class="form-group">
                <label for="totalPrice">결제 금액</label>
                <input type="number" id="totalPrice" name="totalPrice" min="0" readonly>
                <p class="form-help-text">시술 선택 시 자동으로 금액이 입력됩니다.</p>
            </div>

            <div class="form-actions">
                <a href="/reservations" class="btn btn-outline">목록으로</a>
                <button type="submit" class="btn btn-primary">예약하기</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
