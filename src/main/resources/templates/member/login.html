<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<th:block th:replace="~{fragments/simple-header :: simpleHeader}"></th:block>

<div class="page-container">
    <main class="container py-5 simple-page">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="mb-4 text-center">로그인</h2>

                        <div class="alert alert-success" th:if="${param.signup}">
                            회원가입이 완료되었습니다. 로그인해주세요.
                        </div>

                        <div class="alert alert-info" th:if="${param.logout}">
                            로그아웃되었습니다.
                        </div>

                        <div class="alert alert-danger" th:if="${param.error}">
                            로그인에 실패했습니다. 아이디, 비밀번호 또는 계정 상태를 확인해주세요.
                        </div>

                        <form th:action="@{/members/login}" method="post">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <div class="mb-3">
                                <label for="memberId" class="form-label">아이디</label>
                                <input type="text" id="memberId" name="memberId" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">비밀번호</label>
                                <input type="password" id="password" name="password" class="form-control">
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark">로그인</button>
                            </div>
                        </form>

                        <div class="text-center mt-3">
                            <a th:href="@{/members/signup}">회원가입</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
