<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/member.css">
    <script src="/js/common.js"></script>
    <script src="/js/member.js"></script>
</head>
<body>

<th:block th:replace="~{fragments/simple-header :: simpleHeader}"></th:block>

<div class="page-container">
    <main class="container py-5 simple-page">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="mb-4 text-center">회원가입</h2>

                        <div class="alert alert-danger"
                             th:if="${signupErrorMessage}"
                             th:text="${signupErrorMessage}">
                        </div>

                        <form th:action="@{/members/signup}"
                              th:object="${memberSignupRequest}"
                              method="post">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <div class="mb-3">
                                <label for="memberId" class="form-label">아이디</label>
                                <input type="text" id="memberId" th:field="*{memberId}" class="form-control">
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('memberId')}"
                                     th:errors="*{memberId}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">비밀번호</label>
                                <input type="password" id="password" th:field="*{password}" class="form-control">
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('password')}"
                                     th:errors="*{password}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
                                <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" class="form-control">
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('passwordConfirm')}"
                                     th:errors="*{passwordConfirm}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="name" class="form-label">이름</label>
                                <input type="text" id="name" th:field="*{name}" class="form-control">
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('name')}"
                                     th:errors="*{name}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">전화번호</label>
                                <input type="text" id="phone" th:field="*{phone}" class="form-control">
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('phone')}"
                                     th:errors="*{phone}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">이메일</label>
                                <input type="text" id="email" th:field="*{email}" class="form-control">
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}"></div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark">회원가입</button>
                            </div>
                        </form>

                        <div class="text-center mt-3">
                            <a th:href="@{/members/login}">로그인 페이지로 이동</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
