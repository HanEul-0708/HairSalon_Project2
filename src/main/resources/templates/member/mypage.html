<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
</head>
<body>

<h2>마이페이지</h2>

<div th:replace="~{fragments/message :: flashMessage}"></div>

<!-- 현재 로그인 정보 -->
<div sec:authorize="isAuthenticated()">
    현재 로그인 사용자: <span sec:authentication="name"></span>
</div>

<!-- 관리자만 보이는 링크 -->
<div sec:authorize="hasRole('ADMIN')">
    <a th:href="@{/admin/members}">관리자 회원 관리</a>
</div>

<hr>

<h3>내 정보</h3>
<table border="1">
    <tr>
        <th>아이디</th>
        <td th:text="${member.memberId}"></td>
    </tr>
    <tr>
        <th>이름</th>
        <td th:text="${member.name}"></td>
    </tr>
    <tr>
        <th>전화번호</th>
        <td th:text="${member.phone}"></td>
    </tr>
    <tr>
        <th>이메일</th>
        <td th:text="${member.email}"></td>
    </tr>
    <tr>
        <th>권한</th>
        <td th:text="${member.role.description}"></td>
    </tr>
    <tr>
        <th>가입일</th>
        <td th:text="${member.createdAt}"></td>
    </tr>
</table>

<hr>

<h3>회원정보 수정</h3>
<form th:action="@{/members/me/edit}" th:object="${memberUpdateRequest}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div>
        <label for="updateName">이름</label>
        <input type="text" id="updateName" th:field="*{name}">
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <div>
        <label for="updatePhone">전화번호</label>
        <input type="text" id="updatePhone" th:field="*{phone}">
        <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
    </div>

    <div>
        <label for="updateEmail">이메일</label>
        <input type="text" id="updateEmail" th:field="*{email}">
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>

    <button type="submit">회원정보 수정</button>
</form>

<hr>

<h3>비밀번호 변경</h3>
<form th:action="@{/members/me/password}" th:object="${memberPasswordChangeRequest}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div>
        <label for="currentPassword">현재 비밀번호</label>
        <input type="password" id="currentPassword" th:field="*{currentPassword}">
        <div th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
    </div>

    <div>
        <label for="newPassword">새 비밀번호</label>
        <input type="password" id="newPassword" th:field="*{newPassword}">
        <div th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
    </div>

    <button type="submit">비밀번호 변경</button>
</form>

<hr>

<form th:action="@{/members/logout}" method="post">
    <button type="submit">로그아웃</button>
</form>

</body>
</html>
