<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::headExtra}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>

    <th:block th:fragment="headExtra"></th:block>
</head>
<body>

<main class="container py-5">

    <h2 class="mb-4">마이페이지</h2>

    <div th:replace="~{fragments/message :: flashMessage}"></div>

    <div class="mb-3" sec:authorize="isAuthenticated()">
        현재 로그인 사용자: <span sec:authentication="name"></span>
    </div>

    <div class="mb-4" sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/admin/members}" class="btn btn-outline-dark btn-sm">관리자 회원 관리</a>
    </div>

    <hr>

    <h3 class="mb-3">내 정보</h3>
    <table class="table table-bordered">
        <tbody>
        <tr>
            <th>아이디</th>
            <td th:text="${member.memberId}"></td>
        </tr>
        <tr>
            <th>이름</th>
            <td th:text="${member.name}"></td>
        </tr>
        <tr>
            <th>전화번호</th>
            <td th:text="${member.phone}"></td>
        </tr>
        <tr>
            <th>이메일</th>
            <td th:text="${member.email}"></td>
        </tr>
        <tr>
            <th>권한</th>
            <td th:text="${member.role.description}"></td>
        </tr>
        <tr>
            <th>가입일</th>
            <td th:text="${member.createdAt}"></td>
        </tr>
        </tbody>
    </table>

    <hr>

    <h3 class="mb-3">회원정보 수정</h3>
    <form th:action="@{/members/me/edit}" th:object="${memberUpdateRequest}" method="post" class="mb-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="mb-3">
            <label for="updateName" class="form-label">이름</label>
            <input type="text" id="updateName" th:field="*{name}" class="form-control">
            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="updatePhone" class="form-label">전화번호</label>
            <input type="text" id="updatePhone" th:field="*{phone}" class="form-control">
            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('phone')}"
                 th:errors="*{phone}"></div>
        </div>

        <div class="mb-3">
            <label for="updateEmail" class="form-label">이메일</label>
            <input type="text" id="updateEmail" th:field="*{email}" class="form-control">
            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"></div>
        </div>

        <button type="submit" class="btn btn-dark">회원정보 수정</button>
    </form>

    <hr>

    <h3 class="mb-3">비밀번호 변경</h3>
    <form th:action="@{/members/me/password}"
          th:object="${memberPasswordChangeRequest}"
          method="post"
          class="mb-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="mb-3">
            <label for="currentPassword" class="form-label">현재 비밀번호</label>
            <input type="password" id="currentPassword" th:field="*{currentPassword}" class="form-control">
            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('currentPassword')}"
                 th:errors="*{currentPassword}"></div>
        </div>

        <div class="mb-3">
            <label for="newPassword" class="form-label">새 비밀번호</label>
            <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control">
            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('newPassword')}"
                 th:errors="*{newPassword}"></div>
        </div>

        <button type="submit" class="btn btn-dark">비밀번호 변경</button>
    </form>

    <hr>

    <div class="d-flex gap-2">
        <form th:action="@{/}" method="get">
            <button type="submit" class="btn btn-outline-secondary">홈으로</button>
        </form>

        <form th:action="@{/members/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-danger">로그아웃</button>
        </form>
    </div>

</main>

</body>
</html>
