<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">

<!--
  notice-list.html — 공지사항 목록 페이지
  =====================================================
  layout:decorate → layout.html을 뼈대로 사용
  layout:fragment → layout.html의 content 영역을 이걸로 채움
-->

<head>
    <th:block layout:fragment="pageTitle">
        <title>공지사항 | HairSalon</title>
    </th:block>
    <th:block layout:fragment="pageCss">
        <link rel="stylesheet" th:href="@{/css/board.css}">
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <div class="board-wrap">

        <!-- 페이지 타이틀 -->
        <div class="board-header">
            <h2 class="board-title">공지사항</h2>
            <p class="board-subtitle">헤어살롱의 새로운 소식을 전해드립니다.</p>
        </div>

        <!-- 검색 영역 -->
        <form class="board-search-form" th:action="@{/boards/notices}" method="get">
            <input type="text"
                   class="board-search-input"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="검색어를 입력하세요">
            <button type="submit" class="board-search-btn">검색</button>
        </form>

        <!-- 게시글 목록 테이블 -->
        <table class="board-table">
            <thead>
            <tr>
                <th class="col-num">번호</th>
                <th class="col-title">제목</th>
                <th class="col-date">작성일</th>
                <th class="col-view">조회수</th>
            </tr>
            </thead>
            <tbody>
            <!-- 게시글이 없을 때 -->
            <tr th:if="${#lists.isEmpty(boardList)}">
                <td colspan="4" class="board-empty">등록된 공지사항이 없습니다.</td>
            </tr>

            <!-- 게시글 목록 반복 출력 -->
            <tr th:each="board : ${boardList}"
                th:onclick="|location.href='@{/boards/notices/{id}(id=${board.boardId})}'|"
                class="board-row">
                <td th:text="${board.boardId}"></td>
                <td class="board-row-title" th:text="${board.title}"></td>
                <td th:text="${#temporals.format(board.createdAt, 'yyyy.MM.dd')}"></td>
                <td th:text="${board.viewCount}"></td>
            </tr>
            </tbody>
        </table>

        <!-- 관리자만 작성 버튼 표시 -->
        <div class="board-btn-wrap">
            <a th:href="@{/boards/notices/new}"
               sec:authorize="hasRole('ADMIN')"
               class="btn-write">공지사항 작성</a>
        </div>

    </div>

</div>

<th:block layout:fragment="pageJs">
    <script th:src="@{/js/board.js}"></script>
</th:block>

</body>
</html>
