<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::link}, ~{::main})}">

<!--
  qna-detail.html
  =====================================================
  문의게시판 상세 페이지

  board         -> BoardDetailResponse
  board.replies -> List<BoardReplyResponse>
-->

<head>
    <title th:text="${board.title} + ' | HairSalon'">문의 상세 | HairSalon</title>
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>

<body>
<main>

    <div class="board-wrap">

        <!-- 게시글 헤더 -->
        <div class="board-detail-header">
            <h2 class="board-detail-title" th:text="${board.title}">문의 제목</h2>

            <div class="board-detail-info">
                <span th:if="${board.answered}" class="board-status-chip board-status-answered">답변 완료</span>
                <span th:if="${board.reportCount > 0}" class="board-status-chip board-status-report">신고 <strong th:text="${board.reportCount}">0</strong></span>
                <span>
                    작성자:
                    <strong th:text="${board.memberId}">writer</strong>
                </span>
                <span>
                    작성일:
                    <strong th:text="${#temporals.format(board.createdAt, 'yyyy.MM.dd HH:mm')}">
                        2026.04.01 12:00
                    </strong>
                </span>
                <span>
                    조회수:
                    <strong th:text="${board.viewCount}">0</strong>
                </span>
            </div>
        </div>

        <!-- 게시글 본문 -->
        <div class="board-detail-content" th:utext="${board.content}">
            게시글 본문
        </div>

        <!-- 첨부파일 목록 -->
        <div class="board-detail-files" th:if="${not #lists.isEmpty(board.files)}">
            <h4>첨부파일</h4>
            <ul>
                <li th:each="file : ${board.files}">
                    <span class="board-detail-file-name"
                          th:text="${file.originalFilename}">
                        첨부파일명
                    </span>
                </li>
            </ul>
            <p class="board-detail-file-note">문의 게시판 첨부파일은 미리보기만 제공되며 다운로드는 지원하지 않습니다.</p>
        </div>

        <div class="board-detail-images" th:if="${not #lists.isEmpty(board.files)}">
            <div th:each="file : ${board.files}" th:if="${file.image}" class="board-detail-image-item">
                <img th:src="@{/files/images/{stored}(stored=${file.storedFilename})}"
                     th:alt="${file.originalFilename}"
                     class="board-detail-image-preview">
                <div class="board-detail-image-caption" th:text="${file.originalFilename}">image.jpg</div>
            </div>
        </div>

        <!-- 버튼 영역 -->
        <div class="board-detail-btn-wrap">

            <!-- 목록 버튼 -->
            <a th:href="@{/boards/qna}" class="btn-list">목록으로</a>

            <form sec:authorize="isAuthenticated()"
                  th:if="${#authentication.name != board.memberId}"
                  th:action="@{/boards/qna/{id}/report(id=${board.boardId})}"
                  method="post"
                  style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn-delete btn-report">신고</button>
            </form>

            <!-- 작성자 본인만 수정 / 삭제 -->
            <div th:if="${#authentication.name == board.memberId}">
                <a th:href="@{/boards/{id}/edit(id=${board.boardId})}"
                   class="btn-edit">
                    수정
                </a>

                <form th:action="@{/boards/{id}(id=${board.boardId})}"
                      method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?')"
                      style="display:inline">
                    <input type="hidden" name="_method" value="delete">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <button type="submit" class="btn-delete">삭제</button>
                </form>
            </div>

        </div>

        <!-- 관리자 답글 작성 폼 -->
        <div class="board-reply-write-wrap" sec:authorize="hasRole('ADMIN')">
            <h4 class="board-reply-title">답변 작성</h4>

            <form th:action="@{/boards/qna/{boardId}/reply(boardId=${board.boardId})}"
                  method="post"
                  class="board-reply-form">

                <!-- CSRF 토큰 -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- 부모 글 번호 -->
                <input type="hidden" name="parentId" th:value="${board.boardId}">

                <!-- 제목 (선택 입력)
                     비워 두면 서비스에서 Re: 원글제목 자동 생성 -->
                <div class="form-group">
                    <label for="replyTitle" class="form-label">답변 제목</label>
                    <input type="text"
                           id="replyTitle"
                           name="title"
                           class="form-control"
                           placeholder="비워 두면 자동으로 제목이 만들어집니다."
                           maxlength="200">
                </div>

                <!-- 내용 -->
                <div class="form-group">
                    <label for="replyContent" class="form-label">답변 내용</label>
                    <textarea id="replyContent"
                              name="content"
                              class="form-control"
                              rows="6"
                              placeholder="답변 내용을 입력하세요."
                              required></textarea>
                </div>

                <div class="board-btn-wrap">
                    <button type="submit" class="btn-reply">답변 등록</button>
                </div>
            </form>
        </div>

        <!-- 답글 목록 -->
        <div class="board-reply-wrap" th:if="${not #lists.isEmpty(board.replies)}">
            <h4 class="board-reply-title">
                답변 <span th:text="${#lists.size(board.replies)}">0</span>개
            </h4>

            <div class="board-reply" th:each="reply : ${board.replies}">
                <div class="board-reply-info">
                    <span class="board-reply-writer"
                          th:text="${reply.memberId}">admin</span>

                    <span class="board-reply-date"
                          th:text="${#temporals.format(reply.createdAt, 'yyyy.MM.dd HH:mm')}">
                        2026.04.01 12:00
                    </span>

                    <!-- 관리자만 답글 삭제 -->
                    <form sec:authorize="hasRole('ADMIN')"
                          th:action="@{/boards/{id}(id=${reply.boardId})}"
                          method="post"
                          onsubmit="return confirm('답변을 삭제하시겠습니까?')"
                          style="display:inline">
                        <input type="hidden" name="_method" value="delete">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">
                        <button type="submit" class="btn-reply-delete">삭제</button>
                    </form>
                </div>

                <!-- 답글 제목 -->
                <div class="board-reply-subject" th:if="${reply.title != null and !#strings.isEmpty(reply.title)}">
                    <strong th:text="${reply.title}">답글 제목</strong>
                </div>

                <!-- 답글 본문 -->
                <div class="board-reply-content" th:utext="${reply.content}">
                    답글 내용
                </div>
            </div>
        </div>

        <!-- 답글이 하나도 없을 때 -->
        <div class="board-reply-wrap" th:if="${#lists.isEmpty(board.replies)}">
            <h4 class="board-reply-title">답변</h4>
            <div class="board-reply-empty">
                아직 등록된 답변이 없습니다.
            </div>
        </div>

    </div>

    <script th:src="@{/js/board.js}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const replyForm = document.querySelector('.board-reply-form');

            if (replyForm) {
                replyForm.addEventListener('submit', function (event) {
                    const content = document.getElementById('replyContent').value.trim();

                    if (content === '') {
                        event.preventDefault();
                        alert('답변 내용을 입력해 주세요.');
                        document.getElementById('replyContent').focus();
                    }
                });
            }
        });
    </script>

</main>
</body>
</html>
