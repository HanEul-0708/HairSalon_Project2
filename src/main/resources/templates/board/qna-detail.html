<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">

<!--
  qna-detail.html — 문의게시판 상세 페이지
  =====================================================
  board         → BoardDetailResponse 객체
  board.replies → 답글 목록 (관리자 답변)
-->

<head>
    <th:block layout:fragment="pageTitle">
        <title th:text="${board.title} + ' | HairSalon'"></title>
    </th:block>
    <th:block layout:fragment="pageCss">
        <link rel="stylesheet" th:href="@{/css/board.css}">
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <div class="board-wrap">

        <!-- 게시글 헤더 -->
        <div class="board-detail-header">
            <h2 class="board-detail-title" th:text="${board.title}"></h2>
            <div class="board-detail-info">
                <span>작성자: <strong th:text="${board.memberId}"></strong></span>
                <span>작성일: <strong th:text="${#temporals.format(board.createdAt, 'yyyy.MM.dd HH:mm')}"></strong></span>
                <span>조회수: <strong th:text="${board.viewCount}"></strong></span>
            </div>
        </div>

        <!-- 게시글 본문 -->
        <!-- th:utext → 썸머노트 에디터로 작성한 HTML 내용 그대로 렌더링 -->
        <div class="board-detail-content" th:utext="${board.content}"></div>

        <!-- 첨부파일 목록 -->
        <div class="board-detail-files" th:if="${not #lists.isEmpty(board.files)}">
            <h4>첨부파일</h4>
            <ul>
                <li th:each="file : ${board.files}">
                    <a th:href="@{/files/download/{stored}(stored=${file.storedFilename}, originalFilename=${file.originalFilename})}"
                       th:text="${file.originalFilename}">
                    </a>
                </li>
            </ul>
        </div>

        <!-- 버튼 영역 -->
        <div class="board-detail-btn-wrap">

            <!-- 목록으로 버튼 (누구나) -->
            <a th:href="@{/boards/qna}" class="btn-list">목록으로</a>

            <!-- 수정 / 삭제 버튼 (작성자 본인만) -->
            <div th:if="${#authentication.name == board.memberId}">
                <a th:href="@{/boards/{id}/edit(id=${board.boardId})}"
                   class="btn-edit">수정</a>

                <form th:action="@{/boards/{id}/delete(id=${board.boardId})}"
                      method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn-delete">삭제</button>
                </form>
            </div>

            <!-- 답글 작성 버튼 (관리자만) -->
            <div sec:authorize="hasRole('ADMIN')">
                <!-- 수정 후 — 폼으로 변경 -->
                <form th:action="@{/boards/qna/{id}/reply(id=${board.boardId})}"
                      method="post"
                      sec:authorize="hasRole('ADMIN')"
                      style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="parentId" th:value="${board.boardId}">
                    <textarea name="content" style="display:none"></textarea>
                    <a th:href="@{/boards/qna/new(parentId=${board.boardId})}"
                       class="btn-reply">답변 작성</a>
                </form>
            </div>

        </div>

        <!-- 답글 목록 (관리자 답변) -->
        <div class="board-reply-wrap" th:if="${not #lists.isEmpty(board.replies)}">
            <h4 class="board-reply-title">
                답변 <span th:text="${#lists.size(board.replies)}"></span>개
            </h4>

            <div class="board-reply" th:each="reply : ${board.replies}">
                <div class="board-reply-info">
                    <span class="board-reply-writer">
                        관리자
                    </span>
                    <span class="board-reply-date"
                          th:text="${#temporals.format(reply.createdAt, 'yyyy.MM.dd HH:mm')}">
                    </span>

                    <!-- 답글 삭제 버튼 (관리자만) -->
                    <form sec:authorize="hasRole('ADMIN')"
                          th:action="@{/boards/{id}/delete(id=${reply.boardId})}"
                          method="post"
                          onsubmit="return confirm('답변을 삭제하시겠습니까?')"
                          style="display:inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn-reply-delete">삭제</button>
                    </form>
                </div>

                <!-- 답글 본문 -->
                <div class="board-reply-content" th:utext="${reply.content}"></div>
            </div>
        </div>

    </div>

</div>

<th:block layout:fragment="pageJs">
    <script th:src="@{/js/board.js}"></script>
</th:block>

</body>
</html>
