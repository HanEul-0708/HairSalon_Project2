<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::link}, ~{::main})}">
<head>
    <title th:text="${board.title} + ' | HairSalon'">공지사항 상세 | HairSalon</title>
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<main>
    <div class="board-wrap">
        <div class="board-detail-header">
            <h2 class="board-detail-title" th:text="${board.title}">공지사항 제목</h2>
            <div class="board-detail-info">
                <span>작성자 <strong th:text="${board.memberId}">admin</strong></span>
                <span>작성일 <strong th:text="${#temporals.format(board.createdAt, 'yyyy.MM.dd HH:mm')}">2026.04.01 12:00</strong></span>
                <span>조회수 <strong th:text="${board.viewCount}">0</strong></span>
            </div>
        </div>

        <div th:if="${boardMessage != null}"
             class="board-feedback"
             th:classappend="${boardMessageType == 'error'} ? ' board-feedback-error' : (${boardMessageType == 'success'} ? ' board-feedback-success' : ' board-feedback-info')"
             th:text="${boardMessage}">게시판 메시지</div>

        <div class="board-detail-content" th:utext="${board.content}"></div>

        <div class="board-detail-files" th:if="${not #lists.isEmpty(board.files)}">
            <h4>첨부파일</h4>
            <ul>
                <li th:each="file : ${board.files}">
                    <a th:href="@{/files/download/{stored}(stored=${file.storedFilename}, originalFilename=${file.originalFilename})}"
                       th:text="${file.originalFilename}">
                        첨부파일명
                    </a>
                </li>
            </ul>
        </div>

        <div class="board-detail-images" th:if="${not #lists.isEmpty(board.files)}">
            <div th:each="file : ${board.files}" th:if="${file.image}" class="board-detail-image-item">
                <img th:src="@{/files/images/{stored}(stored=${file.storedFilename})}"
                     th:alt="${file.originalFilename}"
                     class="board-detail-image-preview">
                <div class="board-detail-image-caption" th:text="${file.originalFilename}">image.jpg</div>
            </div>
        </div>

        <div class="board-detail-btn-wrap">
            <a th:href="@{/boards/notices}" class="btn-list">목록으로</a>

            <div sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/boards/{id}/edit(id=${board.boardId})}" class="btn-edit">수정</a>

                <form th:action="@{/boards/{id}(id=${board.boardId})}"
                      method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?')">
                    <input type="hidden" name="_method" value="delete">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn-delete">삭제</button>
                </form>
            </div>
        </div>

        <div class="board-reply-wrap" th:if="${not #lists.isEmpty(board.replies)}">
            <h4 class="board-reply-title">답변 <span th:text="${#lists.size(board.replies)}">0</span>개</h4>
            <div class="board-reply" th:each="reply : ${board.replies}">
                <div class="board-reply-info">
                    <span class="board-reply-writer">관리자</span>
                    <span class="board-reply-date"
                          th:text="${#temporals.format(reply.createdAt, 'yyyy.MM.dd HH:mm')}">2026.04.01 12:00</span>
                </div>
                <div class="board-reply-content" th:utext="${reply.content}"></div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/board.js}"></script>
</main>
</body>
</html>
