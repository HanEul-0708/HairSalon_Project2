<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">

<!--
  write.html — 게시글 작성 페이지
  =====================================================
  공지사항 / QnA 둘 다 이 파일 하나로 처리
  boardType → "NOTICE" 또는 "QNA" (Controller에서 전달)
  parentId  → 답글 작성 시 원글 번호 (없으면 null)
-->

<head>
    <th:block layout:fragment="pageTitle">
        <title>글 작성 | HairSalon</title>
    </th:block>
    <th:block layout:fragment="pageCss">
        <link rel="stylesheet" th:href="@{/css/board.css}">
        <!-- 썸머노트 CSS (CDN) -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-bs5.min.css">
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <div class="board-wrap">

        <!-- 페이지 타이틀 -->
        <div class="board-header">
            <h2 class="board-title"
                th:text="${boardType == 'NOTICE'} ? '공지사항 작성' : '문의 작성'"></h2>
        </div>

        <!-- 작성 폼 -->
        <form class="board-write-form"
              th:action="${boardType == 'NOTICE'} ? '/boards/notices' : '/boards/qna'"
              method="post"
              enctype="multipart/form-data">

            <!-- CSRF 토큰 (Spring Security 필수) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <!-- 게시글 타입 (hidden) -->
            <input type="hidden" name="type" th:value="${boardType}">

            <!-- 답글인 경우 원글 번호 (hidden) -->
            <input type="hidden" name="parentId" th:value="${param.parentId}">

            <!-- 제목 입력 -->
            <div class="form-group">
                <label for="title" class="form-label">제목</label>
                <input type="text"
                       id="title"
                       name="title"
                       class="form-control board-input-title"
                       placeholder="제목을 입력하세요"
                       maxlength="200"
                       required>
            </div>

            <!-- 본문 입력 (썸머노트 에디터) -->
            <div class="form-group">
                <label for="content" class="form-label">내용</label>
                <!-- 썸머노트가 이 textarea를 에디터로 변환해줌 -->
                <textarea id="content"
                          name="content"
                          class="form-control"
                          rows="10">
                </textarea>
            </div>

            <!-- 첨부파일 업로드 -->
            <div class="form-group">
                <label class="form-label">첨부파일</label>
                <input type="file"
                       name="files"
                       class="form-control"
                       multiple>
                <small class="form-text">파일은 최대 10MB, 여러 개 선택 가능합니다.</small>
            </div>

            <!-- 버튼 영역 -->
            <div class="board-btn-wrap">
                <button type="button"
                        class="btn-cancel"
                        onclick="history.back()">취소</button>
                <button type="submit"
                        class="btn-submit"
                        id="submitBtn">등록</button>
            </div>

        </form>

    </div>

</div>

<th:block layout:fragment="pageJs">
    <!-- 썸머노트 JS (CDN) — jQuery 먼저, 그 다음 썸머노트 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-bs5.min.js"></script>
    <!-- 썸머노트 한국어 패키지 -->
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/lang/summernote-ko-KR.min.js"></script>

    <script>
        $(document).ready(function () {

            // 썸머노트 에디터 초기화
            $('#content').summernote({
                lang: 'ko-KR',          // 한국어 UI
                height: 400,            // 에디터 높이
                minHeight: 200,
                maxHeight: 600,
                placeholder: '내용을 입력하세요.',
                toolbar: [
                    ['style', ['bold', 'italic', 'underline', 'strikethrough', 'clear']],
                    ['font', ['fontsize', 'color', 'highlight']],
                    ['para', ['ul', 'ol', 'paragraph']],
                    ['insert', ['picture', 'link']],
                    ['view', ['codeview']]
                ],

                // 이미지 업로드 핸들러
                // 썸머노트가 이미지 첨부 시 자동으로 서버에 전송
                callbacks: {
                    onImageUpload: function (files) {
                        uploadEditorImage(files[0]);
                    }
                }
            });

            // 등록 버튼 클릭 시 에디터 내용 유효성 검사
            $('#submitBtn').on('click', function () {
                const content = $('#content').summernote('code');
                if ($('#title').val().trim() === '') {
                    alert('제목을 입력해주세요.');
                    return false;
                }
                if (content.trim() === '' || content === '<p><br></p>') {
                    alert('내용을 입력해주세요.');
                    return false;
                }
            });
        });

        // 썸머노트 이미지 업로드 함수
        // FileController의 POST /files/images 로 전송
        function uploadEditorImage(file) {
            const formData = new FormData();
            formData.append('file', file);

            // CSRF 토큰 가져오기
            const csrfToken = document.querySelector('input[name="_csrf"]').value;
            const csrfHeader = 'X-CSRF-TOKEN';

            fetch('/files/images', {
                method: 'POST',
                headers: {
                    [csrfHeader]: csrfToken
                },
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    // 업로드 성공 시 에디터에 이미지 삽입
                    $('#content').summernote('insertImage', data.url);
                })
                .catch(error => {
                    alert('이미지 업로드에 실패했습니다.');
                    console.error('이미지 업로드 오류:', error);
                });
        }
    </script>

    <script th:src="@{/js/board.js}"></script>
</th:block>

</body>
</html>
