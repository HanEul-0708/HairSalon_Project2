<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::link}, ~{::main})}">

<!--
  write.html — 게시글 작성 페이지
  =====================================================
  boardType → "NOTICE" 또는 "QNA" (Controller에서 전달)
  공지사항 / QnA 둘 다 이 파일 하나로 처리
-->

<head>
    <title>글 작성 | HairSalon</title>
    <link rel="stylesheet" th:href="@{/css/board.css}">
    <!-- 썸머노트 CSS (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-bs5.min.css">
</head>

<body>
<main>

    <div class="board-wrap">

        <!-- 페이지 타이틀 -->
        <div class="board-header">
            <h2 class="board-title"
                th:text="${boardType == 'NOTICE'} ? '공지사항 작성' : '문의 작성'"></h2>
        </div>

        <!-- 작성 폼 -->
        <form class="board-write-form"
              th:action="${boardType == 'NOTICE'} ? '/boards/notices' : '/boards/qna'"
              method="post"
              enctype="multipart/form-data">

            <!-- CSRF 토큰 -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <!-- 제목 입력 -->
            <div class="form-group">
                <label for="title" class="form-label">제목</label>
                <input type="text"
                       id="title"
                       name="title"
                       class="form-control board-input-title"
                       placeholder="제목을 입력하세요"
                       maxlength="200"
                       required>
            </div>

            <!-- 본문 입력 (썸머노트 에디터) -->
            <div class="form-group">
                <label for="content" class="form-label">내용</label>
                <textarea id="content"
                          name="content"
                          class="form-control"
                          rows="10">
                </textarea>
            </div>

            <!-- 첨부파일 업로드 -->
            <div class="form-group">
                <label class="form-label">첨부파일</label>
                <div class="board-file-dropzone" data-file-dropzone>
                    <p class="board-file-dropzone-text">파일을 여기로 끌어 놓거나 아래에서 선택하세요.</p>
                    <input type="file"
                           name="files"
                           class="form-control"
                           multiple>
                </div>
                <div class="board-file-preview" data-file-preview></div>
                <small class="form-text">파일은 최대 10MB, 여러 개 선택 가능합니다.</small>
            </div>

            <!-- 버튼 영역 -->
            <div class="board-btn-wrap">
                <button type="button"
                        class="btn-cancel"
                        onclick="history.back()">취소</button>
                <button type="submit"
                        class="btn-submit"
                        id="submitBtn">등록</button>
            </div>

        </form>

    </div>

    <!-- 썸머노트 JS (CDN) — jQuery는 layout.html에서 이미 로드됨 -->
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-bs5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/lang/summernote-ko-KR.min.js"></script>
    <script th:src="@{/js/board.js}"></script>

    <script>
        $(document).ready(function () {

            // 썸머노트 에디터 초기화
            $('#content').summernote({
                lang: 'ko-KR',
                height: 400,
                minHeight: 200,
                maxHeight: 600,
                placeholder: '내용을 입력하세요.',
                toolbar: [
                    ['style', ['bold', 'italic', 'underline', 'strikethrough', 'clear']],
                    ['font', ['fontsize', 'color', 'highlight']],
                    ['para', ['ul', 'ol', 'paragraph']],
                    ['insert', ['picture', 'link']],
                    ['view', ['codeview']]
                ],
                callbacks: {
                    onImageUpload: function (files) {
                        uploadEditorImage(files[0]);
                    }
                }
            });

            // 등록 버튼 유효성 검사
            $('#submitBtn').on('click', function () {
                const content = $('#content').summernote('code');
                if ($('#title').val().trim() === '') {
                    alert('제목을 입력해주세요.');
                    return false;
                }
                if (content.trim() === '' || content === '<p><br></p>') {
                    alert('내용을 입력해주세요.');
                    return false;
                }
            });
        });

        // 썸머노트 이미지 업로드 함수
        function uploadEditorImage(file) {
            const formData = new FormData();
            formData.append('file', file);

            const csrfToken = document.querySelector('input[name="_csrf"]').value;

            fetch('/files/images', {
                method: 'POST',
                headers: { 'X-CSRF-TOKEN': csrfToken },
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    $('#content').summernote('insertImage', data.url, function ($image) {
                        if (data.originalFilename) {
                            $image.attr('data-original-name', data.originalFilename);
                            $image.attr('alt', data.originalFilename);
                        }
                    });
                })
                .catch(error => {
                    alert('이미지 업로드에 실패했습니다.');
                    console.error('이미지 업로드 오류:', error);
                });
        }
    </script>

</main>
</body>
</html>
