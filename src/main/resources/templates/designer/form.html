<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
 <meta charset="UTF-8">
 <title th:text="${designerId != null} ? '디자이너 수정' : '디자이너 등록'">디자이너 관리</title>
 <link rel="stylesheet" th:href="@{/css/designer.css}">
 <script th:src="@{/js/designer.js}" defer></script>
</head>
<body>
<main>
 <div class="container designer-page designer-form-page">
  <section class="catalog-hero">
   <p class="catalog-hero__eyebrow">Designer Admin</p>
   <h1 class="catalog-hero__title" th:text="${designerId != null} ? '디자이너 수정' : '디자이너 등록'">디자이너 등록</h1>
   <p class="catalog-hero__subtitle">소속 미용실, 연결 회원, 소개와 경력 정보를 입력합니다.</p>
  </section>

  <th:block th:if="${designerId != null}">
   <form method="post" th:action="@{/admin/designers/{id}/edit(id=${designerId})}" th:object="${form}" class="designer-form">
	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

	<div class="designer-form-row">
	 <div class="form-group">
	  <label for="salonIdEdit">미용실 ID</label>
	  <input id="salonIdEdit" type="text" inputmode="numeric" pattern="[0-9]+" required th:field="*{salonId}" class="form-control" th:errorclass="is-invalid" aria-describedby="salonIdEditError" th:attr="aria-invalid=${#fields.hasErrors('salonId')}" placeholder="미용실 ID">
	  <p id="salonIdEditError" class="invalid-feedback" th:if="${#fields.hasErrors('salonId')}" th:errors="*{salonId}"></p>
	 </div>
	 <div class="form-group">
	  <label for="memberIdEdit">연결 회원 ID</label>
	  <input id="memberIdEdit" maxlength="30" th:field="*{memberId}" class="form-control" th:errorclass="is-invalid" aria-describedby="memberIdEditError" th:attr="aria-invalid=${#fields.hasErrors('memberId')}" placeholder="연결 회원 ID">
	  <p id="memberIdEditError" class="invalid-feedback" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></p>
	 </div>
	</div>

	<div class="form-group">
	 <label for="nameEdit">이름</label>
	 <input id="nameEdit" maxlength="50" required th:field="*{name}" class="form-control" th:errorclass="is-invalid" aria-describedby="nameEditError" th:attr="aria-invalid=${#fields.hasErrors('name')}" placeholder="디자이너 이름">
	 <p id="nameEditError" class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
	</div>

	<div class="form-group">
	 <label for="profileImageEdit">프로필 이미지 URL</label>
	 <input id="profileImageEdit" maxlength="255" th:field="*{profileImage}" class="form-control" th:errorclass="is-invalid" aria-describedby="profileImageEditError" th:attr="aria-invalid=${#fields.hasErrors('profileImage')}" placeholder="프로필 이미지 URL">
	 <p id="profileImageEditError" class="invalid-feedback" th:if="${#fields.hasErrors('profileImage')}" th:errors="*{profileImage}"></p>
	</div>

	<div class="form-group">
	 <label for="introductionEdit">소개</label>
	 <textarea id="introductionEdit" th:field="*{introduction}" placeholder="디자이너 소개"></textarea>
	</div>

	<div class="form-group">
	 <label for="careerYearsEdit">경력 연차</label>
	 <input id="careerYearsEdit" type="text" inputmode="numeric" pattern="[0-9]+" required th:field="*{careerYears}" class="form-control" th:errorclass="is-invalid" aria-describedby="careerYearsEditError" th:attr="aria-invalid=${#fields.hasErrors('careerYears')}" placeholder="경력 연차">
	 <p id="careerYearsEditError" class="invalid-feedback" th:if="${#fields.hasErrors('careerYears')}" th:errors="*{careerYears}"></p>
	</div>

	<div class="designer-actions">
	 <button type="submit" class="btn btn-primary">수정 저장</button>
	 <a th:href="@{/designers/{id}(id=${designerId})}" class="btn btn-outline">취소</a>
	</div>
   </form>
  </th:block>

  <th:block th:unless="${designerId != null}">
   <form method="post" th:action="@{/admin/designers}" th:object="${form}" class="designer-form">
	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

	<div class="designer-form-row">
	 <div class="form-group">
	  <label for="salonIdCreate">미용실 ID</label>
	  <input id="salonIdCreate" type="text" inputmode="numeric" pattern="[0-9]+" required th:field="*{salonId}" class="form-control" th:errorclass="is-invalid" aria-describedby="salonIdCreateError" th:attr="aria-invalid=${#fields.hasErrors('salonId')}" placeholder="미용실 ID">
	  <p id="salonIdCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('salonId')}" th:errors="*{salonId}"></p>
	 </div>
	 <div class="form-group">
	  <label for="memberIdCreate">연결 회원 ID</label>
	  <input id="memberIdCreate" maxlength="30" th:field="*{memberId}" class="form-control" th:errorclass="is-invalid" aria-describedby="memberIdCreateError" th:attr="aria-invalid=${#fields.hasErrors('memberId')}" placeholder="연결 회원 ID">
	  <p id="memberIdCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></p>
	 </div>
	</div>

	<div class="form-group">
	 <label for="nameCreate">이름</label>
	 <input id="nameCreate" maxlength="50" required th:field="*{name}" class="form-control" th:errorclass="is-invalid" aria-describedby="nameCreateError" th:attr="aria-invalid=${#fields.hasErrors('name')}" placeholder="디자이너 이름">
	 <p id="nameCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
	</div>

	<div class="form-group">
	 <label for="profileImageCreate">프로필 이미지 URL</label>
	 <input id="profileImageCreate" maxlength="255" th:field="*{profileImage}" class="form-control" th:errorclass="is-invalid" aria-describedby="profileImageCreateError" th:attr="aria-invalid=${#fields.hasErrors('profileImage')}" placeholder="프로필 이미지 URL">
	 <p id="profileImageCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('profileImage')}" th:errors="*{profileImage}"></p>
	</div>

	<div class="form-group">
	 <label for="introductionCreate">소개</label>
	 <textarea id="introductionCreate" th:field="*{introduction}" placeholder="디자이너 소개"></textarea>
	</div>

	<div class="form-group">
	 <label for="careerYearsCreate">경력 연차</label>
	 <input id="careerYearsCreate" type="text" inputmode="numeric" pattern="[0-9]+" required th:field="*{careerYears}" class="form-control" th:errorclass="is-invalid" aria-describedby="careerYearsCreateError" th:attr="aria-invalid=${#fields.hasErrors('careerYears')}" placeholder="경력 연차">
	 <p id="careerYearsCreateError" class="invalid-feedback" th:if="${#fields.hasErrors('careerYears')}" th:errors="*{careerYears}"></p>
	</div>

	<div class="designer-actions">
	 <button type="submit" class="btn btn-primary">등록</button>
	 <a th:href="@{/designers}" class="btn btn-outline">취소</a>
	</div>
   </form>
  </th:block>
 </div>
</main>
</body>
</html>
