<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>디자이너 목록</title>
    <link rel="stylesheet" th:href="@{/css/designer.css}">
    <script th:src="@{/js/designer.js}" defer></script>
</head>
<body>
<main>
    <div class="container designer-page designer-list-page">
        <div class="catalog-hero">
            <p class="catalog-hero__eyebrow">Designer Directory</p>
            <h1 class="catalog-hero__title">디자이너 목록</h1>
            <p class="catalog-hero__subtitle">이름, 소개, 미용실명으로 디자이너를 검색하고 평점 기준으로 비교해보세요.</p>
        </div>

        <form method="get" th:action="@{/designers}" class="designer-search-form">
            <input type="hidden" name="searched" value="true">

            <div class="designer-search-form__intro">
                <p class="designer-search-form__eyebrow">Designer Finder</p>
                <h2>조건에 맞는 디자이너를 찾아보세요</h2>
            </div>

            <div class="designer-search-form__controls">
                <div class="designer-search-form__fields">
                    <input type="text" name="keyword" placeholder="이름, 소개, 미용실명 검색" th:value="${search.keyword}">
                    <select name="minRating">
                        <option value="" th:selected="${search.minRating == null}">최소 평점</option>
                        <option value="1" th:selected="${search.minRating != null and search.minRating.intValue() == 1}">1점 이상</option>
                        <option value="2" th:selected="${search.minRating != null and search.minRating.intValue() == 2}">2점 이상</option>
                        <option value="3" th:selected="${search.minRating != null and search.minRating.intValue() == 3}">3점 이상</option>
                        <option value="4" th:selected="${search.minRating != null and search.minRating.intValue() == 4}">4점 이상</option>
                        <option value="5" th:selected="${search.minRating != null and search.minRating.intValue() == 5}">5점</option>
                    </select>
                    <select name="sortBy">
                        <option value="" th:selected="${search.sortBy == null or search.sortBy == ''}">평점순</option>
                        <option value="reviews" th:selected="${search.sortBy == 'reviews'}">리뷰순</option>
                        <option value="likes" th:selected="${search.sortBy == 'likes'}">좋아요순</option>
                        <option value="career" th:selected="${search.sortBy == 'career'}">경력순</option>
                    </select>
                </div>

                <div class="designer-search-form__actions">
                    <button type="submit" class="btn btn-primary">검색</button>
                    <a th:href="@{/designers}" class="btn btn-outline">초기화</a>
                </div>
            </div>
        </form>

        <div th:if="${searched}">
            <div class="designer-results-head catalog-results-head">
                <div>
                    <p class="designer-results-head__eyebrow catalog-results-head__eyebrow">Results</p>
                    <h2>디자이너 <span th:text="${totalDesignerCount}">0</span>명</h2>
                </div>
            </div>

            <div class="designer-grid" th:if="${!#lists.isEmpty(designers)}">
                <article class="designer-card" th:each="designer : ${designers}">
                    <div class="designer-card__body">
                        <div class="designer-card__avatar"
                             th:text="${#strings.substring(designer.name, 0, 1)}">D</div>

                        <p class="designer-card__salon" th:text="${designer.salonName}">Salon Name</p>
                        <h3 class="designer-card__name">
                            <a th:href="@{/designers/{id}(id=${designer.designerId})}"
                               th:text="${designer.name}">디자이너명</a>
                        </h3>

                        <div class="designer-card__stats">
                            <span class="designer-card__stat">평점 <strong th:text="${#numbers.formatDecimal(designer.averageRating, 1, 0)}">0</strong></span>
                            <span class="designer-card__stat">리뷰 <strong th:text="${designer.reviewCount}">0</strong></span>
                            <span class="designer-card__stat">좋아요 <strong th:text="${designer.likeCount}">0</strong></span>
                            <span class="designer-card__stat">경력 <strong th:text="${designer.careerYears}">0</strong>년</span>
                        </div>

                        <div class="designer-card__footer">
                            <a th:href="@{/designers/{id}(id=${designer.designerId})}" class="btn btn-outline">상세 보기</a>
                            <a th:href="@{/salons/{id}(id=${designer.salonId})}" class="btn btn-primary">미용실 보기</a>
                        </div>
                    </div>
                </article>
            </div>

            <div class="designer-empty-state" th:if="${#lists.isEmpty(designers)}">
                <h2>조건에 맞는 디자이너가 없습니다.</h2>
                <p>검색어를 바꾸거나 평점 조건을 낮춰서 다시 찾아보세요.</p>
                <a th:href="@{/designers}" class="btn btn-primary">검색 다시 하기</a>
            </div>

            <div class="pagination" th:if="${totalPages > 1}">
                <a class="page-link"
                   th:classappend="${currentPage == 1 ? ' disabled' : ''}"
                   th:href="@{/designers(page=${currentPage > 1 ? currentPage - 1 : 1}, searched=true, keyword=${search.keyword}, minRating=${search.minRating}, sortBy=${search.sortBy})}">이전</a>
                <a class="page-link"
                   th:each="pageNumber : ${pageNumbers}"
                   th:classappend="${pageNumber == currentPage ? ' active' : ''}"
                   th:href="@{/designers(page=${pageNumber}, searched=true, keyword=${search.keyword}, minRating=${search.minRating}, sortBy=${search.sortBy})}"
                   th:text="${pageNumber}">1</a>
                <a class="page-link"
                   th:classappend="${currentPage == totalPages ? ' disabled' : ''}"
                   th:href="@{/designers(page=${currentPage < totalPages ? currentPage + 1 : totalPages}, searched=true, keyword=${search.keyword}, minRating=${search.minRating}, sortBy=${search.sortBy})}">다음</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
