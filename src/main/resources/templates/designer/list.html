<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>디자이너 목록</title>
    <link rel="stylesheet" th:href="@{/css/designer.css}">
    <script th:src="@{/js/designer.js}" defer></script>
</head>
<body>
<main>
    <div class="container">
        <div class="page-header">
            <h1>디자이너 목록</h1>
            <p>조건에 맞는 디자이너를 검색하고 상세 정보를 확인할 수 있습니다.</p>
        </div>

        <form method="get" th:action="@{/designers}" class="search-form">
            <input type="text" name="keyword" placeholder="이름/소개/살롱" th:value="${search.keyword}">
            <input type="number" name="salonId" placeholder="살롱 ID" th:value="${search.salonId}">
            <input type="number" step="0.1" name="minRating" placeholder="최소 평점" th:value="${search.minRating}">
            <input type="number" name="minCareerYears" placeholder="최소 경력" th:value="${search.minCareerYears}">
            <button type="submit" class="btn btn-primary">검색</button>
        </form>

        <div class="table-wrap">
            <table class="data-table">
                <thead>
                <tr><th>ID</th><th>이름</th><th>살롱</th><th>경력</th><th>평점</th><th>리뷰수</th></tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(designers)}">
                    <td colspan="6">조회된 디자이너가 없습니다.</td>
                </tr>
                <tr th:each="designer : ${designers}">
                    <td th:text="${designer.designerId}">1</td>
                    <td><a th:href="@{/designers/{id}(id=${designer.designerId})}" th:text="${designer.name}">이름</a></td>
                    <td th:text="${designer.salonName}">살롱</td>
                    <td th:text="${designer.careerYears}">0</td>
                    <td th:text="${designer.averageRating}">0</td>
                    <td th:text="${designer.reviewCount}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
