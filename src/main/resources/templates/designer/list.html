<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>디자이너 목록</title></head>
<body>
<h1>디자이너 목록</h1>
<form method="get" th:action="@{/designers}">
    <input type="text" name="keyword" placeholder="이름/소개/살롱" th:value="${search.keyword}">
    <input type="number" name="salonId" placeholder="살롱 ID" th:value="${search.salonId}">
    <input type="number" step="0.1" name="minRating" placeholder="최소 평점" th:value="${search.minRating}">
    <input type="number" name="minCareerYears" placeholder="최소 경력" th:value="${search.minCareerYears}">
    <button type="submit">검색</button>
</form>
<table border="1">
    <thead><tr><th>ID</th><th>이름</th><th>살롱</th><th>경력</th><th>평점</th><th>리뷰수</th></tr></thead>
    <tbody>
    <tr th:each="designer : ${designers}">
        <td th:text="${designer.designerId}">1</td>
        <td><a th:href="@{/designers/{id}(id=${designer.designerId})}" th:text="${designer.name}">이름</a></td>
        <td th:text="${designer.salonName}">살롱</td>
        <td th:text="${designer.careerYears}">0</td>
        <td th:text="${designer.averageRating}">0</td>
        <td th:text="${designer.reviewCount}">0</td>
    </tr>
    </tbody>
</table>
</body>
</html>
