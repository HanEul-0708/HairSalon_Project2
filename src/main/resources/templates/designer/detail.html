<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>디자이너 상세</title></head>
<body>
<h1 th:text="${designer.name}">디자이너</h1>
<p><a th:href="@{/salons/{id}(id=${designer.salonId})}" th:text="${designer.salonName}">살롱</a></p>
<p th:text="${designer.introduction}">소개</p>
<p th:text="|경력 ${designer.careerYears}년|">경력</p>
<p th:text="|평점 ${designer.averageRating} / 리뷰 ${designer.reviewCount}|">통계</p>
<p><a th:href="@{/designers/{id}/edit(id=${designer.designerId})}">수정</a></p>
<form method="post" th:action="@{/designers/{id}(id=${designer.designerId})}">
    <input type="hidden" name="_method" value="delete">
    <button type="submit">삭제</button>
</form>
<h2>가능 시술</h2>
<ul>
    <li th:each="service : ${designer.salonServices}">
        <a th:href="@{/salon-services/{id}(id=${service.serviceId})}" th:text="${service.name}">시술</a>
        <span th:text="| - ${service.price}원|">가격</span>
    </li>
</ul>
</body>
</html>
