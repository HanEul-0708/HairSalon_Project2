<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${designer.name} + ' 상세'">디자이너 상세</title>
    <link rel="stylesheet" th:href="@{/css/designer.css}">
    <script th:src="@{/js/designer.js}" defer></script>
</head>
<body>
<main>
    <div class="container designer-page designer-detail-page">
        <div class="page-header">
            <h1 th:text="${designer.name}">디자이너명</h1>
            <p th:text="|평점 ${designer.averageRating} / 리뷰 ${designer.reviewCount}|">디자이너 평점</p>
        </div>

        <div class="designer-detail">
            <section class="designer-detail__main">
                <div class="designer-profile">
                    <div class="designer-profile__avatar"
                         th:text="${designer.name != null and !#strings.isEmpty(designer.name) ? #strings.substring(designer.name, 0, 1) : 'D'}">
                        D
                    </div>
                    <div>
                        <h2 th:text="${designer.name}">디자이너명</h2>
                        <p class="designer-card__meta">
                            <a th:href="@{/salons/{id}(id=${designer.salonId})}" th:text="${designer.salonName}">살롱명</a>
                        </p>
                        <p class="designer-card__meta" th:text="|경력 ${designer.careerYears}년|">경력 정보</p>
                    </div>
                </div>

                <div class="detail-card">
                    <h2>소개</h2>
                    <p th:text="${#strings.isEmpty(designer.introduction) ? '등록된 소개가 없습니다.' : designer.introduction}">
                        디자이너 소개
                    </p>
                </div>

                <div class="detail-card mt-lg">
                    <h2>담당 가능 시술</h2>
                    <ul class="salon-service-list">
                        <li class="salon-service-item" th:each="service : ${designer.salonServices}">
                            <a th:href="@{/salon-services/{id}(id=${service.serviceId})}" th:text="${service.name}">시술명</a>
                            <span th:text="|${service.price}원 / ${service.duration}분|">시술 정보</span>
                        </li>
                    </ul>
                    <div class="empty-state" th:if="${#lists.isEmpty(designer.salonServices)}">
                        <p>연결된 시술이 없습니다.</p>
                    </div>
                </div>
            </section>

            <aside class="designer-detail__side">
                <h2>기본 정보</h2>
                <div class="designer-info-list">
                    <div class="designer-info-item">
                        <strong>살롱</strong>
                        <span th:text="${designer.salonName}">살롱명</span>
                    </div>
                    <div class="designer-info-item" th:if="${designer.memberId}">
                        <strong>회원 ID</strong>
                        <span th:text="${designer.memberId}">memberId</span>
                    </div>
                    <div class="designer-info-item">
                        <strong>경력</strong>
                        <span th:text="|${designer.careerYears}년|">0년</span>
                    </div>
                    <div class="designer-info-item">
                        <strong>평점</strong>
                        <span th:text="${designer.averageRating}">0</span>
                    </div>
                    <div class="designer-info-item">
                        <strong>리뷰 수</strong>
                        <span th:text="${designer.reviewCount}">0</span>
                    </div>
                </div>

                <div class="designer-actions" sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/designers/{id}/edit(id=${designer.designerId})}" class="btn btn-outline">수정</a>
                    <form method="post"
                          th:action="@{/admin/designers/{id}/delete(id=${designer.designerId})}"
                          data-designer-delete-form>
                        <button type="submit" class="btn btn-danger">삭제</button>
                    </form>
                </div>
            </aside>
        </div>
    </div>
</main>
</body>
</html>
