<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<!--
  board-error.html — 게시판 오류 페이지
  =====================================================
  BoardException 발생 시 GlobalExceptionHandler 가 이 페이지로 이동
  예) 존재하지 않는 게시글 조회, 수정/삭제 권한 없음
-->

<head>
    <th:block layout:fragment="pageTitle">
        <title>오류 | HairSalon</title>
    </th:block>
    <th:block layout:fragment="pageCss">
        <style>
            .error-wrap {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 60vh;
                text-align: center;
                padding: 40px 20px;
            }
            .error-code {
                font-size: 5rem;
                font-weight: 700;
                color: #c9a84c;
                font-family: 'Georgia', serif;
                line-height: 1;
                margin-bottom: 16px;
            }
            .error-title {
                font-size: 1.4rem;
                color: #fff;
                margin-bottom: 12px;
            }
            .error-message {
                font-size: 0.95rem;
                color: #888;
                margin-bottom: 32px;
                max-width: 400px;
                line-height: 1.7;
            }
            .error-btn-wrap {
                display: flex;
                gap: 12px;
                justify-content: center;
            }
            .error-btn-home {
                padding: 10px 24px;
                background: #c9a84c;
                color: #1c1c1e;
                border-radius: 4px;
                text-decoration: none;
                font-weight: 700;
                font-size: 0.9rem;
                transition: background 0.2s;
            }
            .error-btn-home:hover {
                background: #e8c96d;
                color: #1c1c1e;
            }
            .error-btn-back {
                padding: 10px 24px;
                background: transparent;
                color: #c9a84c;
                border: 1px solid #c9a84c;
                border-radius: 4px;
                text-decoration: none;
                font-size: 0.9rem;
                transition: all 0.2s;
                cursor: pointer;
            }
            .error-btn-back:hover {
                background: #c9a84c;
                color: #1c1c1e;
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <div class="error-wrap">

        <!-- 오류 아이콘 -->
        <div class="error-code">!</div>

        <!-- 오류 제목 -->
        <h2 class="error-title">요청을 처리할 수 없습니다</h2>

        <!-- 오류 메시지 (GlobalExceptionHandler 에서 전달) -->
        <p class="error-message"
           th:text="${errorMessage} ?: '요청하신 페이지를 처리하는 중 문제가 발생했습니다.'">
        </p>

        <!-- 버튼 -->
        <div class="error-btn-wrap">
            <a th:href="@{/}" class="error-btn-home">홈으로</a>
            <button class="error-btn-back" onclick="history.back()">이전 페이지</button>
        </div>

    </div>

</div>
</body>
</html>
