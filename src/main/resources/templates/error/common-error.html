<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<!--
  common-error.html — 공통 오류 페이지
  =====================================================
  GlobalExceptionHandler 에서 예상치 못한 오류 발생 시 이 페이지로 이동
  예) 서버 내부 오류 (500), 알 수 없는 예외
-->

<head>
    <th:block layout:fragment="pageTitle">
        <title>서버 오류 | HairSalon</title>
    </th:block>
    <th:block layout:fragment="pageCss">
        <style>
            .error-wrap {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 60vh;
                text-align: center;
                padding: 40px 20px;
            }
            .error-code {
                font-size: 6rem;
                font-weight: 700;
                color: #c9a84c;
                font-family: 'Georgia', serif;
                line-height: 1;
                margin-bottom: 16px;
                letter-spacing: -2px;
            }
            .error-title {
                font-size: 1.4rem;
                color: #fff;
                margin-bottom: 12px;
            }
            .error-message {
                font-size: 0.95rem;
                color: #888;
                margin-bottom: 32px;
                max-width: 440px;
                line-height: 1.7;
            }
            .error-btn-wrap {
                display: flex;
                gap: 12px;
                justify-content: center;
            }
            .error-btn-home {
                padding: 10px 24px;
                background: #c9a84c;
                color: #1c1c1e;
                border-radius: 4px;
                text-decoration: none;
                font-weight: 700;
                font-size: 0.9rem;
                transition: background 0.2s;
            }
            .error-btn-home:hover {
                background: #e8c96d;
                color: #1c1c1e;
            }
            .error-btn-back {
                padding: 10px 24px;
                background: transparent;
                color: #c9a84c;
                border: 1px solid #c9a84c;
                border-radius: 4px;
                text-decoration: none;
                font-size: 0.9rem;
                transition: all 0.2s;
                cursor: pointer;
            }
            .error-btn-back:hover {
                background: #c9a84c;
                color: #1c1c1e;
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <div class="error-wrap">

        <!-- 오류 코드 -->
        <div class="error-code">500</div>

        <!-- 오류 제목 -->
        <h2 class="error-title">서버에서 문제가 발생했습니다</h2>

        <!-- 오류 메시지 -->
        <p class="error-message"
           th:text="${errorMessage} ?: '일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.'">
        </p>

        <!-- 버튼 -->
        <div class="error-btn-wrap">
            <a th:href="@{/}" class="error-btn-home">홈으로</a>
            <button class="error-btn-back" onclick="history.back()">이전 페이지</button>
        </div>

    </div>

</div>
</body>
</html>
