<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리뷰 상세</title>
    <link rel="stylesheet" th:href="@{/css/review.css}">
    <script th:src="@{/js/review.js}" defer></script>
</head>
<body>
<main>
    <div class="container review-page review-detail-page">
        <div class="page-header">
            <h1 class="page-title">리뷰 상세</h1>
            <p class="page-desc">작성된 리뷰 내용과 시술 정보를 확인할 수 있습니다.</p>
        </div>

        <div class="review-detail">
            <div class="review-detail__header">
                <div class="review-card__header">
                    <div class="review-card__avatar" th:text="${#strings.substring(review.memberName, 0, 1)}">김</div>
                    <div class="review-card__meta">
                        <p class="review-card__name" th:text="${T(com.hairsalonproject2.common.util.NameMaskingUtils).maskName(review.memberName)}">회원명</p>
                        <p class="review-card__info">
                            디자이너:
                            <span th:text="${review.designerName}">디자이너명</span>
                        </p>
                        <p class="review-card__date"
                           th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm')}">2026-04-07 15:00</p>
                    </div>
                    <div class="review-card__rating" th:text="${'★ ' + review.rating}">★ 5</div>
                </div>
            </div>

            <div class="review-reservation-summary">
                <p><strong>시술</strong><span th:text="${review.serviceName}">커트</span></p>
                <p><strong>예약 번호</strong><span th:text="${review.reservationId}">1</span></p>
                <p><strong>예약 일시</strong><span th:text="${review.reservationDate + ' ' + review.reservationTime}">2026-04-07 15:00</span></p>
            </div>

            <div class="review-detail__content review-detail__content-box" th:text="${review.content}">리뷰 내용</div>

            <div class="review-detail__images" th:if="${!#lists.isEmpty(review.images)}">
                <img th:each="image : ${review.images}"
                     th:src="${image.imageUrl}"
                     alt="리뷰 이미지">
            </div>

            <div class="review-detail__reply" th:if="${review.replyContent != null and !#strings.isEmpty(review.replyContent)}">
                <div class="review-detail__reply-title">디자이너 답변</div>
                <div class="review-detail__reply-content" th:text="${review.replyContent}">답글 내용</div>
            </div>

            <div class="review-detail__bottom">
                <div class="review-detail__stats">
                    <span>좋아요 <strong th:text="${review.likeCount}">0</strong></span>
                    <button type="button"
                            class="review-like-button"
                            th:classappend="${review.likedByCurrentUser ? ' is-liked' : ''}"
                            th:attr="data-review-like=${review.reviewId}"
                            th:disabled="${!isLoggedIn}">
                        <span class="review-like-button__icon">♥</span>
                        <span class="review-like-button__count" th:text="${review.likeCount}">0</span>
                    </button>
                </div>

                <div class="review-detail__manage" th:if="${canManageReview}">
                    <a class="btn btn-outline"
                       th:href="@{/reviews/{reviewId}/edit(reviewId=${review.reviewId})}">수정</a>
                    <button type="button"
                            class="btn btn-danger"
                            data-review-delete
                            th:attr="data-review-id=${review.reviewId}">삭제</button>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
