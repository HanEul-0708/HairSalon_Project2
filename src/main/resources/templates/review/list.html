<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리뷰 목록</title>
    <link rel="stylesheet" th:href="@{/css/review.css}">
</head>
<body>
<main>
    <div class="container review-page review-list-page">
        <div class="page-header">
            <h1 class="page-title">리뷰 목록</h1>
            <p class="page-desc">사용자가 남긴 별점과 후기를 확인할 수 있습니다.</p>
        </div>

        <div class="review-list" th:if="${!#lists.isEmpty(reviews)}">
            <article class="review-card" th:each="review : ${reviews}">
                <div class="review-card__header">
                    <div class="review-card__avatar" th:text="${#strings.substring(review.memberName, 0, 1)}">홍</div>
                    <div class="review-card__meta">
                        <p class="review-card__name" th:text="${review.memberName}">회원명</p>
                        <p class="review-card__info">
                            디자이너:
                            <span th:text="${review.designerName}">디자이너명</span>
                            |
                            예약번호:
                            <span th:text="${review.reservationId}">1</span>
                        </p>
                        <p class="review-card__date" th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm')}">2026-04-06 14:00</p>
                    </div>
                    <div class="review-card__rating" th:text="${'★ ' + review.rating}">★ 5</div>
                </div>

                <p class="review-card__content" th:text="${review.content}">리뷰 내용</p>

                <!-- 디자이너 답글은 실제 답글이 있을 때만 보이게 한다. -->
                <div class="review-card__footer" th:if="${review.replyContent != null and !#strings.isEmpty(review.replyContent)}">
                    <strong>디자이너 답글</strong>
                    <span th:text="${review.replyContent}">답글 내용</span>
                </div>
            </article>
        </div>

        <div class="review-empty" th:if="${#lists.isEmpty(reviews)}">
            <p>아직 등록된 리뷰가 없습니다.</p>
        </div>
    </div>
</main>
</body>
</html>
