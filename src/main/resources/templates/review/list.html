<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리뷰 목록</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/review.css">
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1 class="page-title">리뷰 목록</h1>
        <p class="page-desc">사용자가 작성한 리뷰를 확인할 수 있는 화면입니다.</p>
        <a href="/review/write" class="btn btn-primary">리뷰 작성</a>
    </div>

    <div class="review-list">
        <div class="review-card">
            <div class="review-header">
                <span class="review-writer">홍길동</span>
                <span class="review-rating">★★★★★</span>
            </div>
            <div class="review-content">
                디자이너분이 친절했고 스타일도 만족스러웠습니다.
            </div>
            <div class="review-date">작성일 : 2026-04-02</div>
        </div>

        <div class="review-card">
            <div class="review-header">
                <span class="review-writer">김민수</span>
                <span class="review-rating">★★★★☆</span>
            </div>
            <div class="review-content">
                전체적으로 만족합니다. 다음에도 방문하고 싶습니다.
            </div>
            <div class="review-date">작성일 : 2026-04-01</div>
        </div>
    </div>
</div>

<script src="/js/review.js"></script>
</body>
</html>
