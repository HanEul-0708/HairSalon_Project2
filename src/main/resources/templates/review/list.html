<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리뷰 목록</title>
    <link rel="stylesheet" href="../../static/css/common.css">
    <link rel="stylesheet" href="../../static/css/review.css">
    <script src="../../static/js/review.js"></script>
</head>
<body>

<div class="page-container">

    <h1 class="page-title">리뷰 목록</h1>

    <div class="review-list">

        <div class="review-card">
            <div class="review-header">
                <span class="review-writer">홍길동</span>
                <span class="review-rating">★★★★★</span>
            </div>

            <div class="review-content">
                디자이너분이 너무 친절했고 스타일도 마음에 들었습니다.
            </div>

            <div class="review-image">
                <img src="/images/sample1.jpg" alt="리뷰이미지">
            </div>

            <div class="review-date">
                작성일 : 2026-04-02
            </div>
        </div>


        <div class="review-card">
            <div class="review-header">
                <span class="review-writer">김민수</span>
                <span class="review-rating">★★★★☆</span>
            </div>

            <div class="review-content">
                전체적으로 만족합니다. 다음에 또 방문할 예정입니다.
            </div>

            <div class="review-date">
                작성일 : 2026-04-01
            </div>

            <div class="page-header">
                <h1 class="page-title">리뷰 목록</h1>

                <a href="/review/write" class="btn btn-primary">
                    리뷰 작성
                </a>
            </div>
        </div>

    </div>

</div>

<script src="/js/review.js"></script>

</body>
</html>
