<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>가격 비교</title></head>
<body>
<h1>시술 가격 비교</h1>
<form method="get" th:action="@{/salon-services/compare}">
    <input type="text" name="serviceName" placeholder="시술명" th:value="${serviceName}">
    <input type="text" name="region" placeholder="지역" th:value="${region}">
    <button type="submit">비교</button>
</form>
<table border="1">
    <thead><tr><th>살롱</th><th>지역</th><th>시술</th><th>가격</th><th>시간</th><th>평점</th></tr></thead>
    <tbody>
    <tr th:each="row : ${comparisons}">
        <td><a th:href="@{/salons/{id}(id=${row.salonId})}" th:text="${row.salonName}">살롱</a></td>
        <td th:text="${row.address}">주소</td>
        <td th:text="${row.serviceName}">시술</td>
        <td th:text="${row.price}">0</td>
        <td th:text="${row.duration}">0</td>
        <td th:text="${row.averageRating}">0</td>
    </tr>
    </tbody>
</table>
</body>
</html>
