<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>시술 상세</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/service.css}">
    <script th:src="@{/js/common.js}" defer></script>
    <script th:src="@{/js/service.js}" defer></script>
</head>
<body>
<main>
    <div class="container service-page service-detail-page">
        <div class="catalog-hero">
            <p class="catalog-hero__eyebrow">Service Detail</p>
            <h1 class="catalog-hero__title" th:text="${serviceItem.name}">시술명</h1>
            <p class="catalog-hero__subtitle">시술 가격과 소요 시간, 설명, 연결된 미용실 정보를 한 화면에서 확인할 수 있습니다.</p>
        </div>

        <div class="service-detail-card">
            <div class="service-detail-card__top">
                <div>
                    <p class="service-card__salon">Salon</p>
                    <h2>
                        <a th:href="@{/salons/{id}(id=${serviceItem.salonId})}"
                           th:text="${serviceItem.salonName}">미용실명</a>
                    </h2>
                </div>

                <div class="service-card__price-box">
                    <strong th:text="|${#numbers.formatInteger(serviceItem.price, 3, 'COMMA')}원|">30,000원</strong>
                    <span th:text="|${serviceItem.duration}분|">60분</span>
                </div>
            </div>

            <p class="service-detail-card__desc" th:text="${serviceItem.description}">시술 설명</p>

            <div class="service-actions">
                <a th:href="@{/salons/{id}(id=${serviceItem.salonId})}" class="btn btn-primary">미용실 보기</a>
                <a th:href="@{/salon-services/{id}/edit(id=${serviceItem.serviceId})}"
                   class="btn btn-outline"
                   sec:authorize="hasRole('ADMIN')">수정</a>

                <form method="post"
                      th:action="@{/salon-services/{id}/delete(id=${serviceItem.serviceId})}"
                      data-service-delete
                      sec:authorize="hasRole('ADMIN')">
                    <input type="hidden" name="_method" value="delete">
                    <button type="submit" class="btn btn-outline">삭제</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
