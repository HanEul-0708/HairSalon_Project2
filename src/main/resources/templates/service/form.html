<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${serviceId != null} ? '시술 수정' : '시술 등록'">시술 폼</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/service.css}">
    <script th:src="@{/js/common.js}" defer></script>
    <script th:src="@{/js/service.js}" defer></script>
</head>
<body>
<main>
    <div class="container">
        <div class="page-header">
            <div class="container">
                <h1 class="page-title" th:text="${serviceId != null} ? '시술 수정' : '시술 등록'">시술 등록/수정</h1>
                <p class="page-desc">시술 정보를 입력하거나 수정할 수 있습니다.</p>
            </div>
        </div>

        <!-- 수정용 폼 -->
        <form th:if="${serviceId != null}"
              method="post"
              th:action="@{/salon-services/{id}/edit(id=${serviceId})}"
              th:object="${form}"
              class="service-form">

            <div class="form-group">
                <label for="salonIdEdit">살롱 ID</label>
                <input id="salonIdEdit" th:field="*{salonId}" placeholder="살롱 ID">
            </div>

            <div class="form-group">
                <label for="nameEdit">시술명</label>
                <input id="nameEdit" th:field="*{name}" placeholder="시술명">
            </div>

            <div class="form-group">
                <label for="priceEdit">가격</label>
                <input id="priceEdit" th:field="*{price}" placeholder="가격">
            </div>

            <div class="form-group">
                <label for="durationEdit">소요시간(분)</label>
                <input id="durationEdit" th:field="*{duration}" placeholder="소요시간(분)">
            </div>

            <div class="form-group">
                <label for="descriptionEdit">설명</label>
                <textarea id="descriptionEdit" th:field="*{description}" placeholder="설명"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">수정 완료</button>
                <a th:href="@{/salon-services}" class="btn btn-outline">취소</a>
            </div>
        </form>

        <!-- 등록용 폼 -->
        <form th:unless="${serviceId != null}"
              method="post"
              th:action="@{/salon-services}"
              th:object="${form}"
              class="service-form">

            <div class="form-group">
                <label for="salonIdCreate">살롱 ID</label>
                <input id="salonIdCreate" th:field="*{salonId}" placeholder="살롱 ID">
            </div>

            <div class="form-group">
                <label for="nameCreate">시술명</label>
                <input id="nameCreate" th:field="*{name}" placeholder="시술명">
            </div>

            <div class="form-group">
                <label for="priceCreate">가격</label>
                <input id="priceCreate" th:field="*{price}" placeholder="가격">
            </div>

            <div class="form-group">
                <label for="durationCreate">소요시간(분)</label>
                <input id="durationCreate" th:field="*{duration}" placeholder="소요시간(분)">
            </div>

            <div class="form-group">
                <label for="descriptionCreate">설명</label>
                <textarea id="descriptionCreate" th:field="*{description}" placeholder="설명"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">저장</button>
                <a th:href="@{/salon-services}" class="btn btn-outline">취소</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
