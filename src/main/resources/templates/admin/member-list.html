<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>관리자 - 회원 목록</title>
    <th:block layout:fragment="pageCss"></th:block>
</head>
<body>
<th:block layout:fragment="pageTitle">회원 관리</th:block>
<div layout:fragment="content">
    <div th:replace="~{fragments/message :: flashMessage}"></div>

    <div class="admin-card">
        <div class="admin-card-title">회원 검색</div>
        <form class="admin-filter-wrap" th:action="@{/admin/members}" method="get">
            <input type="text"
                   name="keyword"
                   class="admin-search-input"
                   placeholder="아이디, 이메일, 이름 검색"
                   th:value="${keyword}">

            <select name="role" class="admin-select">
                <option value="">전체 권한</option>
                <option th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role.name()}"
                        th:selected="${role == selectedRole}">
                </option>
            </select>

            <button type="submit" class="admin-btn admin-btn-primary">
                <i class="bi bi-search"></i>
                검색
            </button>
            <a th:href="@{/admin/members}" class="admin-btn admin-btn-secondary">초기화</a>
        </form>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>아이디</th>
                    <th>이름</th>
                    <th>이메일</th>
                    <th>전화번호</th>
                    <th>권한</th>
                    <th>상태</th>
                    <th>가입일</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(members)}">
                    <td colspan="8" style="text-align:center; padding:40px; color:#555;">조회된 회원이 없습니다.</td>
                </tr>
                <tr th:each="member : ${members}">
                    <td th:text="${member.memberId}">member01</td>
                    <td th:text="${member.name}">홍길동</td>
                    <td th:text="${member.email}">test@example.com</td>
                    <td th:text="${member.phone}">010-1234-5678</td>
                    <td>
                        <span th:if="${member.role.name() == 'ADMIN'}" class="badge-notice">ADMIN</span>
                        <span th:if="${member.role.name() == 'DESIGNER'}" class="badge-qna">DESIGNER</span>
                        <span th:if="${member.role.name() == 'USER'}" class="badge-active">USER</span>
                    </td>
                    <td>
                        <span th:if="${member.status.name() == 'ACTIVE'}" class="badge-active" th:text="${member.status.description}">활성</span>
                        <span th:if="${member.status.name() != 'ACTIVE'}" class="badge-inactive" th:text="${member.status.description}">비활성</span>
                    </td>
                    <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}">2026-03-31 10:30</td>
                    <td>
                        <a th:href="@{/admin/members/{memberId}(memberId=${member.memberId})}"
                           class="admin-btn admin-btn-secondary">
                            상세보기
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="admin-pagination" th:if="${totalPages > 1}">
            <a th:if="${currentPage > 0}"
               th:href="@{/admin/members(page=${currentPage - 1}, keyword=${keyword}, role=${selectedRole})}"
               class="admin-page-link">
                이전
            </a>

            <a th:each="pageNumber : ${#numbers.sequence(0, totalPages - 1)}"
               th:href="@{/admin/members(page=${pageNumber}, keyword=${keyword}, role=${selectedRole})}"
               th:text="${pageNumber + 1}"
               th:classappend="${pageNumber == currentPage} ? ' active'"
               class="admin-page-link">
                1
            </a>

            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/admin/members(page=${currentPage + 1}, keyword=${keyword}, role=${selectedRole})}"
               class="admin-page-link">
                다음
            </a>
        </div>
    </div>
</div>
</body>
</html>
