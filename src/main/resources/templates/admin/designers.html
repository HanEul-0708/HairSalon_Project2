<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>관리자 디자이너 관리</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<main>
    <div class="container">
        <div class="page-header">
            <h1>디자이너 관리</h1>
            <p>관리자 전용 디자이너 목록입니다.</p>
        </div>

        <div class="page-actions">
            <a th:href="@{/admin/designers/new}" class="btn btn-outline">디자이너 등록</a>
            <a th:href="@{/admin/salons}" class="btn btn-outline">살롱 관리</a>
            <a th:href="@{/admin/salon-services}" class="btn btn-outline">시술 관리</a>
        </div>

        <div class="admin-card">
            <div class="admin-card-title">디자이너 목록</div>
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>이름</th>
                        <th>살롱</th>
                        <th>평점</th>
                        <th>리뷰</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(designers)}">
                        <td colspan="5" style="text-align:center; padding:40px; color:#555;">조회된 디자이너가 없습니다.</td>
                    </tr>
                    <tr th:each="designer : ${designers}">
                        <td th:text="${designer.designerId}">1</td>
                        <td><a th:href="@{/designers/{id}(id=${designer.designerId})}" th:text="${designer.name}">디자이너명</a></td>
                        <td th:text="${designer.salonName}">살롱명</td>
                        <td th:text="${designer.averageRating}">0</td>
                        <td th:text="${designer.reviewCount}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
