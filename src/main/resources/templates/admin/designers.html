<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}"><head><title>관리자 - 디자이너</title></head>
<body><th:block layout:fragment="pageTitle">디자이너 관리</th:block><div layout:fragment="content">
 <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:16px;"><div class="admin-card"><div class="admin-card-title">디자이너 수</div>
   <div style="font-size:28px; font-weight:700;" th:text="${totalDesignerCount}">0</div></div>
  <div class="admin-card"><div class="admin-card-title">오늘 등록 디자이너</div>
   <div style="font-size:28px; font-weight:700;" th:text="${todayDesignerCount}">0</div>
   <a th:href="@{/admin/designers(todayOnly=true)}" class="admin-btn admin-btn-secondary" style="margin-top:12px;">오늘 상세보기</a></div></div><div class="admin-card">
  <div class="admin-card-title">디자이너 목록</div>
  <form class="admin-filter-wrap" th:action="@{/admin/designers}" method="get">
   <input type="text" name="keyword" class="admin-search-input" placeholder="디자이너명 검색" th:value="${search.keyword}">
   <input type="text" name="salonKeyword" class="admin-search-input" placeholder="살롱명 검색" th:value="${search.salonKeyword}">
   <input type="number" name="minCareerYears" class="admin-search-input" placeholder="최소 경력" th:value="${search.minCareerYears}">
   <select name="sortBy" class="admin-select"><option value="">정렬</option>
	<option value="rating" th:selected="${search.sortBy == 'rating'}">평점순</option>
	<option value="reviews" th:selected="${search.sortBy == 'reviews'}">리뷰순</option>
	<option value="career" th:selected="${search.sortBy == 'career'}">경력순</option>
	<option value="name" th:selected="${search.sortBy == 'name'}">이름순</option></select>
   <input type="hidden" name="todayOnly" th:value="${todayOnly}">
   <button type="submit" class="admin-btn admin-btn-primary"><i class="bi bi-search"></i> 검색</button>
   <a th:href="@{/admin/designers}" class="admin-btn admin-btn-secondary">초기화</a></form>
  <div th:if="${todayOnly}" style="margin-bottom:12px; color:#555;">오늘 등록된 디자이너만 표시 중입니다.</div>
  <div class="admin-table-wrap"><table class="admin-table">
	<thead><tr><th>ID</th><th>이름</th><th>살롱</th><th>경력</th><th>평점</th><th>리뷰</th></tr>
	</thead><tbody><tr th:if="${#lists.isEmpty(designers)}">
	 <td colspan="6" style="text-align:center; padding:40px; color:#555;">조회된 디자이너가 없습니다.</td></tr>
	<tr th:each="designer : ${designers}"><td th:text="${designer.designerId}">1</td>
	 <td><a th:href="@{/designers/{id}(id=${designer.designerId})}" th:text="${designer.name}">디자이너</a></td>
	 <td th:text="${designer.salonName}">살롱</td><td th:text="${designer.careerYears}">0</td>
	 <td th:text="${designer.averageRating}">0</td><td th:text="${designer.reviewCount}">0</td>
	</tr></tbody></table></div></div></div></body></html>
