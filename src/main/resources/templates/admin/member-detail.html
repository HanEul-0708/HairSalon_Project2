<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>관리자 - 회원 상세</title>
    <th:block layout:fragment="pageCss"></th:block>
</head>
<body>
<th:block layout:fragment="pageTitle">회원 상세</th:block>
<div layout:fragment="content">
    <div th:replace="~{fragments/message :: flashMessage}"></div>

    <div th:if="${roleErrorMessage}" class="alert alert-danger" th:text="${roleErrorMessage}"></div>
    <div th:if="${deleteErrorMessage}" class="alert alert-danger" th:text="${deleteErrorMessage}"></div>

    <div class="admin-card">
        <div class="admin-card-title">기본 정보</div>
        <div class="admin-detail-grid">
            <div class="admin-detail-item">
                <span class="admin-detail-label">아이디</span>
                <strong class="admin-detail-value" th:text="${member.memberId}">member01</strong>
            </div>
            <div class="admin-detail-item">
                <span class="admin-detail-label">이름</span>
                <strong class="admin-detail-value" th:text="${member.name}">홍길동</strong>
            </div>
            <div class="admin-detail-item">
                <span class="admin-detail-label">전화번호</span>
                <strong class="admin-detail-value" th:text="${member.phone}">010-1234-5678</strong>
            </div>
            <div class="admin-detail-item">
                <span class="admin-detail-label">이메일</span>
                <strong class="admin-detail-value" th:text="${member.email}">test@example.com</strong>
            </div>
            <div class="admin-detail-item">
                <span class="admin-detail-label">권한</span>
                <strong class="admin-detail-value" th:text="${member.role.name()}">USER</strong>
            </div>
            <div class="admin-detail-item">
                <span class="admin-detail-label">상태</span>
                <strong class="admin-detail-value" th:text="${member.status.description}">활성</strong>
            </div>
            <div class="admin-detail-item">
                <span class="admin-detail-label">가입일</span>
                <strong class="admin-detail-value"
                        th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}">
                    2026-03-31 10:30
                </strong>
            </div>
        </div>
    </div>

    <div class="admin-card">
        <div class="admin-card-title">권한 변경</div>
        <form th:action="@{/admin/members/{memberId}/role(memberId=${member.memberId})}" method="post" class="admin-form-row">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <select name="role" class="admin-select">
                <option th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role.name()}"
                        th:selected="${role == member.role}">
                </option>
            </select>
            <button type="submit" class="admin-btn admin-btn-primary">권한 변경</button>
        </form>
    </div>

    <div class="admin-card">
        <div class="admin-card-title">회원 상태 변경</div>
        <form th:action="@{/admin/members/{memberId}/status(memberId=${member.memberId})}" method="post" class="admin-form-row">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <select name="status" class="admin-select">
                <option th:each="status : ${statuses}"
                        th:value="${status}"
                        th:text="${status.description}"
                        th:selected="${status == member.status}">
                </option>
            </select>
            <button type="submit" class="admin-btn admin-btn-primary">상태 변경</button>
        </form>
    </div>

    <div class="admin-card admin-danger-card">
        <div class="admin-card-title">회원 삭제</div>
        <p class="admin-danger-text">삭제는 되돌릴 수 없습니다. 정말 필요한 경우에만 진행하세요.</p>
        <form th:action="@{/admin/members/{memberId}/delete(memberId=${member.memberId})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit"
                    class="admin-btn admin-btn-danger"
                    onclick="return confirm('정말 이 회원을 삭제하시겠습니까?');">
                회원 삭제
            </button>
        </form>
    </div>

    <div class="admin-action-row">
        <a th:href="@{/admin/members}" class="admin-btn admin-btn-secondary">목록으로</a>
    </div>
</div>
</body>
</html>
