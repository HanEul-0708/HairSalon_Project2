<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>회원 상세</title>
</head>
<body>

<h2>관리자 - 회원 상세</h2>

<div th:replace="~{fragments/message :: flashMessage}"></div>

<div th:if="${roleErrorMessage}" th:text="${roleErrorMessage}"></div>
<div th:if="${deleteErrorMessage}" th:text="${deleteErrorMessage}"></div>

<table border="1">
    <tr>
        <th>아이디</th>
        <td th:text="${member.memberId}"></td>
    </tr>
    <tr>
        <th>이름</th>
        <td th:text="${member.name}"></td>
    </tr>
    <tr>
        <th>전화번호</th>
        <td th:text="${member.phone}"></td>
    </tr>
    <tr>
        <th>이메일</th>
        <td th:text="${member.email}"></td>
    </tr>
    <tr>
        <th>권한</th>
        <td th:text="${member.role.description}"></td>
    </tr>
    <tr>
        <th>가입일</th>
        <td th:text="${member.createdAt}"></td>
    </tr>
    <tr>
        <th>상태</th>
        <td th:text="${member.status.description}"></td>
    </tr>
</table>

<hr>

<h3>권한 변경</h3>
<form th:action="@{/admin/members/{memberId}/role(memberId=${member.memberId})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <label>
        <select name="role">
            <option th:each="role : ${roles}"
                    th:value="${role}"
                    th:text="${role.description}"
                    th:selected="${role == member.role}">
            </option>
        </select>
    </label>
    <button type="submit">권한 변경</button>
</form>

<hr>

<h3>회원 상태 변경</h3>
<form th:action="@{/admin/members/{memberId}/status(memberId=${member.memberId})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <label>
        <select name="status">
            <option th:each="status : ${statuses}"
                    th:value="${status}"
                    th:text="${status.description}"
                    th:selected="${status == member.status}">
            </option>
        </select>
    </label>

    <button type="submit">상태 변경</button>
</form>

<hr>

<h3>회원 삭제</h3>
<form th:action="@{/admin/members/{memberId}/delete(memberId=${member.memberId})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <button type="submit"
            onclick="return confirm('정말 이 회원을 삭제하시겠습니까?');">
        회원 삭제
    </button>
</form>

<hr>

<div>
    <a th:href="@{/admin/members}">목록으로</a>
</div>

</body>
</html>
