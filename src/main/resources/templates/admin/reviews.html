<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>관리자 - 리뷰 관리</title>
</head>
<body>
<th:block layout:fragment="pageTitle">리뷰 관리</th:block>
<div layout:fragment="content">
    <div class="admin-card">
        <div class="admin-card-title">전체 리뷰 목록</div>
        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>회원</th>
                    <th>디자이너</th>
                    <th>예약번호</th>
                    <th>별점</th>
                    <th>내용</th>
                    <th>작성일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(reviews)}">
                    <td colspan="7" style="text-align:center; padding:40px; color:#555;">등록된 리뷰가 없습니다.</td>
                </tr>
                <tr th:each="review : ${reviews}">
                    <td th:text="${review.reviewId}">1</td>
                    <td th:text="${review.memberName}">회원명</td>
                    <td th:text="${review.designerName}">디자이너명</td>
                    <td th:text="${review.reservationId}">10</td>
                    <td th:text="${'★ ' + review.rating}">★ 5</td>
                    <td th:text="${review.content != null and review.content.length() > 40 ? #strings.substring(review.content, 0, 40) + '...' : review.content}">리뷰 내용</td>
                    <td th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm')}">2026-04-07 12:00</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
