<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | 관리자">관리자</title>
    <style>
        html.admin-scroll-restoring body {
            visibility: hidden;
        }
    </style>
    <script>
        (function () {
            try {
                if (window.history && 'scrollRestoration' in window.history) {
                    window.history.scrollRestoration = 'manual';
                }

                if (sessionStorage.getItem('admin-pagination-scroll-state')) {
                    document.documentElement.classList.add('admin-scroll-restoring');
                }
            } catch (e) {
                document.documentElement.classList.remove('admin-scroll-restoring');
            }
        }());
    </script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <th:block layout:fragment="pageCss"></th:block>
</head>
<body class="admin-body">
<div class="admin-wrap">
    <aside class="admin-sidebar">
        <div class="admin-logo">
            <a th:href="@{/}" class="admin-logo-link">
                <span class="admin-logo-text">HairSalon</span>
                <span class="admin-logo-sub">ADMIN</span>
            </a>
        </div>

        <div class="admin-user-info">
            <i class="bi bi-person-circle admin-user-icon"></i>
            <span sec:authentication="name">관리자</span>
        </div>

        <nav class="admin-nav">
            <ul class="admin-nav-list">
                <li class="admin-nav-item">
                    <a th:href="@{/admin}"
                       th:classappend="${currentMenu == 'dashboard'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-speedometer2"></i>
                        <span>대시보드</span>
                    </a>
                </li>
                <li class="admin-nav-item">
                    <a th:href="@{/admin/boards}"
                       th:classappend="${currentMenu == 'boards'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-journal-text"></i>
                        <span>게시글 관리</span>
                    </a>
                </li>
                <li class="admin-nav-item">
                    <a th:href="@{/admin/members}"
                       th:classappend="${currentMenu == 'members'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-people"></i>
                        <span>회원 관리</span>
                    </a>
                </li>
                <li class="admin-nav-item">
                    <a th:href="@{/admin/salons}"
                       th:classappend="${currentMenu == 'salons'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-shop"></i>
                        <span>살롱 관리</span>
                    </a>
                </li>
                <li class="admin-nav-item">
                    <a th:href="@{/admin/reviews}"
                       th:classappend="${currentMenu == 'reviews'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-star"></i>
                        <span>리뷰 관리</span>
                    </a>
                </li>
                <li class="admin-nav-item">
                    <a th:href="@{/admin/reservations}"
                       th:classappend="${currentMenu == 'reservations'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-calendar-check"></i>
                        <span>예약 관리</span>
                    </a>
                </li>
                <li class="admin-nav-item">
                    <a th:href="@{/admin/designers}"
                       th:classappend="${currentMenu == 'designers'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-scissors"></i>
                        <span>디자이너 관리</span>
                    </a>
                </li>
                <li class="admin-nav-item">
                    <a th:href="@{/admin/salon-services}"
                       th:classappend="${currentMenu == 'services'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-stars"></i>
                        <span>시술 관리</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="admin-sidebar-footer">
            <a th:href="@{/}" class="admin-btn-home">
                <i class="bi bi-house"></i>
                <span>메인으로 이동</span>
            </a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="admin-btn-logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>로그아웃</span>
                </button>
            </form>
        </div>
    </aside>

    <main class="admin-main">
        <div class="admin-topbar">
            <h1 class="admin-page-title" layout:fragment="pageTitle">관리자 페이지</h1>
        </div>
        <div class="admin-content">
            <div layout:fragment="content"></div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/admin.js}"></script>
<th:block layout:fragment="pageJs"></th:block>
</body>
</html>
