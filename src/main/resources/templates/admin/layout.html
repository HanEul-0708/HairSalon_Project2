<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
  admin/layout.html — 관리자 전용 레이아웃
  =====================================================
  일반 layout.html 과 별개로 관리자 페이지에서만 사용
  왼쪽 사이드바 + 오른쪽 본문 구조
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | 관리자">관리자</title>

    <!-- Bootstrap 5 CDN -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <!-- 관리자 CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">

    <!-- 페이지별 추가 CSS -->
    <th:block layout:fragment="pageCss"></th:block>
</head>

<body class="admin-body">

<!-- 관리자 전체 래퍼 -->
<div class="admin-wrap">

    <!-- 왼쪽 사이드바 -->
    <aside class="admin-sidebar">

        <!-- 로고 영역 -->
        <div class="admin-logo">
            <a th:href="@{/}" class="admin-logo-link">
                <span class="admin-logo-text">살롱어때?</span>
                <span class="admin-logo-sub">관리자</span>
            </a>
        </div>

        <!-- 관리자 정보 -->
        <div class="admin-user-info">
            <i class="bi bi-person-circle admin-user-icon"></i>
            <span sec:authentication="name">관리자</span>
        </div>

        <!-- 사이드바 메뉴 -->
        <nav class="admin-nav">
            <ul class="admin-nav-list">

                <li class="admin-nav-item">
                    <a th:href="@{/admin}"
                       th:classappend="${currentMenu == 'dashboard'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-speedometer2"></i>
                        <span>대시보드</span>
                    </a>
                </li>

                <li class="admin-nav-item">
                    <a th:href="@{/admin/boards}"
                       th:classappend="${currentMenu == 'boards'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-journal-text"></i>
                        <span>게시글 관리</span>
                    </a>
                </li>

                <li class="admin-nav-item">
                    <a th:href="@{/admin/members}"
                       th:classappend="${currentMenu == 'members'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-people"></i>
                        <span>회원 관리</span>
                    </a>
                </li>

                <li class="admin-nav-item">
                    <a th:href="@{/admin/salons}"
                       th:classappend="${currentMenu == 'salons'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-shop"></i>
                        <span>살롱 관리</span>
                    </a>
                </li>

                <li class="admin-nav-item">
                    <a th:href="@{/admin/designers}"
                       th:classappend="${currentMenu == 'designers'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-scissors"></i>
                        <span>디자이너 관리</span>
                    </a>
                </li>

                <li class="admin-nav-item">
                    <a th:href="@{/admin/salon-services}"
                       th:classappend="${currentMenu == 'services'} ? 'active'"
                       class="admin-nav-link">
                        <i class="bi bi-stars"></i>
                        <span>시술 관리</span>
                    </a>
                </li>

            </ul>
        </nav>

        <!-- 하단 버튼 -->
        <div class="admin-sidebar-footer">
            <a th:href="@{/}" class="admin-btn-home">
                <i class="bi bi-house"></i>
                <span>사이트로 이동</span>
            </a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="admin-btn-logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>로그아웃</span>
                </button>
            </form>
        </div>

    </aside>

    <!-- 오른쪽 본문 영역 -->
    <main class="admin-main">

        <!-- 상단 헤더바 -->
        <div class="admin-topbar">
            <h1 class="admin-page-title" layout:fragment="pageTitle">관리자 페이지</h1>
        </div>

        <!-- 페이지 본문 -->
        <div class="admin-content">
            <div layout:fragment="content">
                <!-- 각 페이지 내용이 여기에 들어옴 -->
            </div>
        </div>

    </main>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- 공통 JS -->
<script th:src="@{/js/common.js}"></script>
<!-- 관리자 JS -->
<script th:src="@{/js/admin.js}"></script>

<!-- 페이지별 추가 JS -->
<th:block layout:fragment="pageJs"></th:block>

</body>
</html>
