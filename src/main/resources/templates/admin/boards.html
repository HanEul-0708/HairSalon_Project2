<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{admin/layout}">

<!--
  admin/boards.html — 게시글 관리 페이지
  =====================================================
  boardList   → 전체 게시글 목록
  noticeCount → 공지사항 수
  qnaCount    → 문의 게시글 수
  currentMenu → 'boards' (사이드바 활성화용)
-->

<head>
    <th:block layout:fragment="pageCss"></th:block>
</head>

<body>

<!-- 페이지 타이틀 (admin/layout.html 의 topbar 에 표시) -->
<th:block layout:fragment="pageTitle">게시글 관리</th:block>

<div layout:fragment="content">

    <!-- 통계 카드 -->
    <div class="admin-stat-wrap">

        <div class="admin-stat-card">
            <span class="admin-stat-label">전체 게시글</span>
            <span class="admin-stat-value" th:text="${noticeCount + qnaCount}">0</span>
            <i class="bi bi-journal-text admin-stat-icon"></i>
        </div>

        <div class="admin-stat-card">
            <span class="admin-stat-label">공지사항</span>
            <span class="admin-stat-value" th:text="${noticeCount}">0</span>
            <i class="bi bi-megaphone admin-stat-icon"></i>
        </div>

        <div class="admin-stat-card">
            <span class="admin-stat-label">문의 게시글</span>
            <span class="admin-stat-value" th:text="${qnaCount}">0</span>
            <i class="bi bi-chat-dots admin-stat-icon"></i>
        </div>

        <div class="admin-stat-card">
            <span class="admin-stat-label">오늘 등록</span>
            <span class="admin-stat-value" th:text="${todayCount}">0</span>
            <i class="bi bi-calendar-plus admin-stat-icon"></i>
        </div>

    </div>

    <!-- 게시글 목록 카드 -->
    <div class="admin-card">
        <div class="admin-card-title">전체 게시글 목록</div>

        <!-- 검색 / 필터 -->
        <form class="admin-filter-wrap" th:action="@{/admin/boards}" method="get">
            <select name="type" class="admin-select" onchange="this.form.submit()">
                <option value="">전체</option>
                <option value="NOTICE"
                        th:selected="${selectedType == 'NOTICE'}">공지사항</option>
                <option value="QNA"
                        th:selected="${selectedType == 'QNA'}">문의</option>
            </select>
            <input type="text"
                   name="keyword"
                   class="admin-search-input"
                   th:value="${keyword}"
                   placeholder="제목으로 검색">
            <button type="submit" class="admin-btn admin-btn-primary">
                <i class="bi bi-search"></i> 검색
            </button>
        </form>

        <!-- 게시글 테이블 -->
        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>번호</th>
                    <th>유형</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>조회수</th>
                    <th>작성일</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <!-- 게시글 없을 때 -->
                <tr th:if="${#lists.isEmpty(boardList)}">
                    <td colspan="7"
                        style="text-align:center; padding:40px; color:#555;">
                        게시글이 없습니다.
                    </td>
                </tr>

                <!-- 게시글 목록 반복 -->
                <tr th:each="board : ${boardList}">
                    <td th:text="${board.boardId}"></td>
                    <td>
                            <span th:if="${board.type == 'NOTICE'}"
                                  class="badge-notice">공지</span>
                        <span th:if="${board.type == 'QNA'}"
                              class="badge-qna">문의</span>
                    </td>
                    <td>
                        <a th:if="${board.type == 'NOTICE'}"
                           th:href="@{/boards/notices/{id}(id=${board.boardId})}"
                           th:text="${board.title}"
                           style="color:#ccc; text-decoration:none;">
                        </a>
                        <a th:if="${board.type == 'QNA'}"
                           th:href="@{/boards/qna/{id}(id=${board.boardId})}"
                           th:text="${board.title}"
                           style="color:#ccc; text-decoration:none;">
                        </a>
                    </td>
                    <td th:text="${board.memberId}"></td>
                    <td th:text="${board.viewCount}"></td>
                    <td th:text="${#temporals.format(board.createdAt, 'yyyy.MM.dd')}"></td>
                    <td>
                        <!-- 삭제 버튼 -->
                        <form th:action="@{/admin/boards/{id}/delete(id=${board.boardId})}"
                              method="post"
                              style="display:inline"
                              onsubmit="return confirm('정말 삭제하시겠습니까?')">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">
                            <button type="submit" class="admin-btn admin-btn-danger">
                                <i class="bi bi-trash"></i> 삭제
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

<th:block layout:fragment="pageJs">
    <script th:src="@{/js/admin.js}"></script>
</th:block>

</body>
</html>
