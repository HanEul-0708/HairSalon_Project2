<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 게시글 관리</title>
</head>
<body>
<th:block layout:fragment="pageTitle">게시글 관리</th:block>

<div layout:fragment="content">
    <div th:replace="~{fragments/message :: flashMessage}"></div>

    <div class="admin-stat-wrap">
        <div class="admin-stat-card">
            <span class="admin-stat-label">전체 게시글</span>
            <span class="admin-stat-value" th:text="${noticeCount + qnaCount}">0</span>
        </div>
        <div class="admin-stat-card">
            <span class="admin-stat-label">공지사항</span>
            <span class="admin-stat-value" th:text="${noticeCount}">0</span>
        </div>
        <div class="admin-stat-card">
            <span class="admin-stat-label">문의사항</span>
            <span class="admin-stat-value" th:text="${qnaCount}">0</span>
        </div>
        <div class="admin-stat-card">
            <span class="admin-stat-label">오늘 등록</span>
            <span class="admin-stat-value" th:text="${todayCount}">0</span>
        </div>
        <div class="admin-stat-card">
            <span class="admin-stat-label">숨김 글</span>
            <span class="admin-stat-value" th:text="${hiddenCount}">0</span>
        </div>
        <div class="admin-stat-card">
            <span class="admin-stat-label">신고 글</span>
            <span class="admin-stat-value" th:text="${reportedCount}">0</span>
        </div>
    </div>

    <div class="admin-card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; flex-wrap:wrap;">
            <div class="admin-card-title" style="margin-bottom:0;">게시글 목록</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <form th:action="@{/admin/boards/seed/notices}" method="post" onsubmit="return confirm('공지사항 더미를 생성하시겠습니까?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="admin-btn admin-btn-secondary">공지사항 더미 생성</button>
                </form>
                <form th:action="@{/admin/boards/seed/qna}" method="post" onsubmit="return confirm('문의사항 더미를 생성하시겠습니까?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="admin-btn admin-btn-secondary">문의사항 더미 생성</button>
                </form>
                <form th:action="@{/admin/boards/seed/qna-replies}" method="post" onsubmit="return confirm('문의 답변 더미를 생성하시겠습니까?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="admin-btn admin-btn-secondary">문의 답변 생성</button>
                </form>
            </div>
        </div>

        <form class="admin-filter-wrap" th:action="@{/admin/boards}" method="get">
            <select name="type" class="admin-select">
                <option value="">전체</option>
                <option value="NOTICE" th:selected="${selectedType == 'NOTICE'}">공지사항</option>
                <option value="QNA" th:selected="${selectedType == 'QNA'}">문의사항</option>
            </select>
            <input type="text" name="keyword" class="admin-search-input" th:value="${keyword}" placeholder="제목, 내용, 작성자 검색">
            <button type="submit" class="admin-btn admin-btn-primary">
                <i class="bi bi-search"></i> 검색
            </button>
        </form>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>번호</th>
                    <th>유형</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>상태</th>
                    <th>신고</th>
                    <th>조회수</th>
                    <th>작성일</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(boardList)}">
                    <td colspan="9" style="text-align:center; padding:40px; color:#555;">게시글이 없습니다.</td>
                </tr>
                <tr th:each="board : ${boardList}">
                    <td th:text="${board.boardId}">1</td>
                    <td>
                        <span th:if="${board.type == 'NOTICE'}" class="badge-notice">공지</span>
                        <span th:if="${board.type == 'QNA'}" class="badge-qna">문의</span>
                    </td>
                    <td>
                        <a th:if="${board.type == 'NOTICE'}"
                           th:href="@{/boards/notices/{id}(id=${board.boardId})}"
                           th:text="${board.title}"
                           class="admin-table-link">제목</a>
                        <a th:if="${board.type == 'QNA'}"
                           th:href="@{/boards/qna/{id}(id=${board.boardId})}"
                           th:text="${board.title}"
                           class="admin-table-link">제목</a>
                    </td>
                    <td th:text="${board.memberId}">writer</td>
                    <td>
                        <span th:if="${board.hidden}" class="badge-hidden">숨김</span>
                        <span th:if="${!board.hidden and board.answered}" class="badge-answer">답변완료</span>
                        <span th:if="${!board.hidden and !board.answered}" class="badge-wait">게시중</span>
                    </td>
                    <td>
                        <span th:text="${board.reportCount}">0</span>
                        <form th:if="${board.reportCount > 0}"
                              th:action="@{/admin/boards/{id}/reports/reset(id=${board.boardId})}"
                              method="post"
                              style="display:inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="admin-btn admin-btn-secondary">신고 초기화</button>
                        </form>
                    </td>
                    <td th:text="${board.viewCount}">0</td>
                    <td th:text="${#temporals.format(board.createdAt, 'yyyy.MM.dd')}">2026.04.10</td>
                    <td>
                        <form th:if="${!board.hidden}"
                              th:action="@{/admin/boards/{id}/hide(id=${board.boardId})}"
                              method="post"
                              style="display:inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="reason" value="관리자 숨김 처리">
                            <button type="submit" class="admin-btn admin-btn-secondary">숨김</button>
                        </form>
                        <form th:if="${board.hidden}"
                              th:action="@{/admin/boards/{id}/unhide(id=${board.boardId})}"
                              method="post"
                              style="display:inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="admin-btn admin-btn-primary">숨김 해제</button>
                        </form>
                        <form th:action="@{/admin/boards/{id}(id=${board.boardId})}"
                              method="post"
                              style="display:inline"
                              onsubmit="return confirm('정말 삭제하시겠습니까?');">
                            <input type="hidden" name="_method" value="delete">
                            <input type="hidden" name="reason" value="관리자 강제 삭제">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="admin-btn admin-btn-danger">
                                <i class="bi bi-trash"></i> 삭제
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="admin-pagination" th:if="${boardPage != null and boardPage.totalPages > 1}">
            <a th:if="${previousGroupPage != null}"
               th:href="@{/admin/boards(page=${previousGroupPage}, type=${selectedType}, keyword=${keyword})}"
               class="admin-page-link">이전</a>
            <a th:each="pageNumber : ${pageNumbers}"
               th:href="@{/admin/boards(page=${pageNumber}, type=${selectedType}, keyword=${keyword})}"
               th:text="${pageNumber}"
               th:classappend="${pageNumber == currentPage} ? ' active'"
               class="admin-page-link">1</a>
            <a th:if="${nextGroupPage != null}"
               th:href="@{/admin/boards(page=${nextGroupPage}, type=${selectedType}, keyword=${keyword})}"
               class="admin-page-link">다음</a>
        </div>
    </div>

    <div class="admin-card" th:if="${deleteLogs != null}">
        <div class="admin-card-title">최근 강제 삭제 기록</div>
        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>삭제시각</th>
                    <th>게시글</th>
                    <th>유형</th>
                    <th>작성자</th>
                    <th>삭제자</th>
                    <th>사유</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(deleteLogs)}">
                    <td colspan="6" style="text-align:center; padding:30px; color:#555;">아직 강제 삭제 기록이 없습니다.</td>
                </tr>
                <tr th:each="log : ${deleteLogs}">
                    <td th:text="${#temporals.format(log.createdAt, 'yyyy.MM.dd HH:mm')}">2026.04.10 10:00</td>
                    <td>
                        <strong th:text="${log.boardTitle}">제목</strong>
                        <div class="admin-meta-text" th:text="|글 번호: ${log.boardId}|">글 번호: 1</div>
                    </td>
                    <td th:text="${log.boardType}">NOTICE</td>
                    <td th:text="${log.writerId}">writer</td>
                    <td th:text="${log.deletedBy}">admin</td>
                    <td th:text="${log.deleteReason}">사유</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
