<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{admin/layout}">
<head>
    <title>관리자 - 대시보드</title>
    <th:block layout:fragment="pageCss"></th:block>
</head>
<body>
<th:block layout:fragment="pageTitle">관리자 대시보드</th:block>
<div layout:fragment="content">
    <div class="admin-card admin-hero-card">
        <div class="admin-card-title">관리자 홈</div>
        <div class="admin-dashboard-hero">
            <div>
                <h2 class="admin-dashboard-heading">운영 화면 바로가기</h2>
                <p class="admin-dashboard-subtitle">
                    게시판, 회원, 살롱, 디자이너, 시술 관리 화면을 여기서 바로 이동할 수 있습니다.
                </p>
            </div>
            <div class="admin-dashboard-user" sec:authorize="isAuthenticated()">
                현재 로그인 관리자
                <strong sec:authentication="name"></strong>
            </div>
        </div>
    </div>

    <div class="admin-shortcut-grid">
        <a th:href="@{/admin/boards}" class="admin-shortcut-card">
            <div class="admin-shortcut-icon"><i class="bi bi-journal-text"></i></div>
            <div class="admin-shortcut-body">
                <h3>게시판 관리</h3>
                <p>공지사항과 문의게시판을 확인하고 관리합니다.</p>
            </div>
        </a>

        <a th:href="@{/admin/members}" class="admin-shortcut-card">
            <div class="admin-shortcut-icon"><i class="bi bi-people"></i></div>
            <div class="admin-shortcut-body">
                <h3>회원 관리</h3>
                <p>회원 권한, 상태 변경과 상세 조회를 처리합니다.</p>
            </div>
        </a>

        <a th:href="@{/admin/salons}" class="admin-shortcut-card">
            <div class="admin-shortcut-icon"><i class="bi bi-shop"></i></div>
            <div class="admin-shortcut-body">
                <h3>살롱 관리</h3>
                <p>등록된 살롱 목록과 기본 정보를 한 번에 봅니다.</p>
            </div>
        </a>

        <a th:href="@{/admin/designers}" class="admin-shortcut-card">
            <div class="admin-shortcut-icon"><i class="bi bi-scissors"></i></div>
            <div class="admin-shortcut-body">
                <h3>디자이너 관리</h3>
                <p>디자이너 목록을 확인하고 상세 화면으로 이동합니다.</p>
            </div>
        </a>

        <a th:href="@{/admin/salon-services}" class="admin-shortcut-card">
            <div class="admin-shortcut-icon"><i class="bi bi-stars"></i></div>
            <div class="admin-shortcut-body">
                <h3>시술 관리</h3>
                <p>시술 정보와 연결된 데이터를 관리 화면에서 확인합니다.</p>
            </div>
        </a>
    </div>
</div>
</body>
</html>
