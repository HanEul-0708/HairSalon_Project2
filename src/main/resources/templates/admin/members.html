<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{admin/layout}">

<!--
  admin/members.html — 회원 관리 페이지
  =====================================================
  memberList   → 전체 회원 목록
  totalCount   → 전체 회원 수
  activeCount  → 활성 회원 수
  currentMenu  → 'members' (사이드바 활성화용)
-->

<head>
    <th:block layout:fragment="pageCss"></th:block>
</head>

<body>

<th:block layout:fragment="pageTitle">회원 관리</th:block>

<div layout:fragment="content">

    <!-- 통계 카드 -->
    <div class="admin-stat-wrap">

        <div class="admin-stat-card">
            <span class="admin-stat-label">전체 회원</span>
            <span class="admin-stat-value" th:text="${totalCount}">0</span>
            <i class="bi bi-people admin-stat-icon"></i>
        </div>

        <div class="admin-stat-card">
            <span class="admin-stat-label">활성 회원</span>
            <span class="admin-stat-value" th:text="${activeCount}">0</span>
            <i class="bi bi-person-check admin-stat-icon"></i>
        </div>

        <div class="admin-stat-card">
            <span class="admin-stat-label">비활성 회원</span>
            <span class="admin-stat-value"
                  th:text="${totalCount - activeCount}">0</span>
            <i class="bi bi-person-x admin-stat-icon"></i>
        </div>

        <div class="admin-stat-card">
            <span class="admin-stat-label">오늘 가입</span>
            <span class="admin-stat-value" th:text="${todayCount}">0</span>
            <i class="bi bi-person-plus admin-stat-icon"></i>
        </div>

    </div>

    <!-- 회원 목록 카드 -->
    <div class="admin-card">
        <div class="admin-card-title">전체 회원 목록</div>

        <!-- 검색 / 필터 -->
        <form class="admin-filter-wrap" th:action="@{/admin/members}" method="get">
            <select name="status" class="admin-select" onchange="this.form.submit()">
                <option value="">전체</option>
                <option value="ACTIVE"
                        th:selected="${selectedStatus == 'ACTIVE'}">활성</option>
                <option value="INACTIVE"
                        th:selected="${selectedStatus == 'INACTIVE'}">비활성</option>
            </select>
            <input type="text"
                   name="keyword"
                   class="admin-search-input"
                   th:value="${keyword}"
                   placeholder="회원 ID 또는 이름으로 검색">
            <button type="submit" class="admin-btn admin-btn-primary">
                <i class="bi bi-search"></i> 검색
            </button>
        </form>

        <!-- 회원 테이블 -->
        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>번호</th>
                    <th>회원 ID</th>
                    <th>이름</th>
                    <th>이메일</th>
                    <th>가입일</th>
                    <th>상태</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <!-- 회원 없을 때 -->
                <tr th:if="${#lists.isEmpty(memberList)}">
                    <td colspan="7"
                        style="text-align:center; padding:40px; color:#555;">
                        회원이 없습니다.
                    </td>
                </tr>

                <!-- 회원 목록 반복 -->
                <tr th:each="member : ${memberList}">
                    <td th:text="${member.memberId}"></td>
                    <td th:text="${member.loginId}"></td>
                    <td th:text="${member.name}"></td>
                    <td th:text="${member.email}"></td>
                    <td th:text="${#temporals.format(member.createdAt, 'yyyy.MM.dd')}"></td>
                    <td>
                            <span th:if="${member.status == 'ACTIVE'}"
                                  class="badge-active">활성</span>
                        <span th:if="${member.status == 'INACTIVE'}"
                              class="badge-inactive">비활성</span>
                    </td>
                    <td>
                        <!-- 활성/비활성 전환 버튼 -->
                        <form th:action="@{/admin/members/{id}/status(id=${member.memberId})}"
                              method="post"
                              style="display:inline">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">
                            <button type="submit"
                                    class="admin-btn admin-btn-secondary">
                                <i class="bi bi-arrow-repeat"></i>
                                <span th:text="${member.status == 'ACTIVE'} ? '비활성화' : '활성화'"></span>
                            </button>
                        </form>

                        <!-- 강제 탈퇴 버튼 -->
                        <form th:action="@{/admin/members/{id}/delete(id=${member.memberId})}"
                              method="post"
                              style="display:inline"
                              onsubmit="return confirm('정말 강제 탈퇴 처리하시겠습니까?')">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">
                            <button type="submit" class="admin-btn admin-btn-danger">
                                <i class="bi bi-person-dash"></i> 탈퇴
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

<th:block layout:fragment="pageJs">
    <script th:src="@{/js/admin.js}"></script>
</th:block>

</body>
</html>
