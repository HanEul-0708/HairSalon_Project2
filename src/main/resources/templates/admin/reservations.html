<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>관리자 - 예약 관리</title>
</head>
<body>
<th:block layout:fragment="pageTitle">예약 관리</th:block>
<div layout:fragment="content">
    <div th:replace="~{fragments/message :: flashMessage}"></div>

    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:16px;">
        <div class="admin-card"><div class="admin-card-title">전체 예약</div><div style="font-size:28px; font-weight:700;" th:text="${reservationCount}">0</div></div>
        <div class="admin-card"><div class="admin-card-title">예약 완료</div><div style="font-size:28px; font-weight:700;" th:text="${completedReservationCount}">0</div></div>
        <div class="admin-card"><div class="admin-card-title">예약 대기</div><div style="font-size:28px; font-weight:700;" th:text="${reservedReservationCount}">0</div></div>
        <div class="admin-card"><div class="admin-card-title">예약 취소</div><div style="font-size:28px; font-weight:700;" th:text="${cancelledReservationCount}">0</div></div>
        <div class="admin-card"><div class="admin-card-title">리뷰 수</div><div style="font-size:28px; font-weight:700;" th:text="${reviewCount}">0</div></div>
    </div>

    <div class="admin-card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; flex-wrap:wrap;">
            <div class="admin-card-title" style="margin-bottom:0;">예약 목록</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <form th:action="@{/admin/reservations/seed}" method="post"
                      onsubmit="return confirm('현재 회원, 디자이너, 시술 정보를 기준으로 예약 더미를 생성합니다. 계속할까요?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="admin-btn admin-btn-primary">
                        <i class="bi bi-calendar-plus"></i>
                        예약 더미 생성
                    </button>
                </form>
                <form th:action="@{/admin/reservations/seed-reviews}" method="post"
                      onsubmit="return confirm('완료된 예약 중 리뷰가 없는 예약에만 리뷰 더미를 생성합니다. 계속할까요?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="admin-btn admin-btn-secondary">
                        <i class="bi bi-chat-left-text"></i>
                        리뷰 더미 생성
                    </button>
                </form>
            </div>
        </div>

        <form class="admin-filter-wrap" th:action="@{/admin/reservations}" method="get">
            <input type="text"
                   name="keyword"
                   class="admin-search-input"
                   placeholder="예약번호, 회원 ID, 디자이너명, 시술명 검색"
                   th:value="${keyword}">
            <select name="status" class="admin-select">
                <option value="">전체 상태</option>
                <option th:each="statusItem : ${statuses}"
                        th:value="${statusItem}"
                        th:text="${statusItem.name()}"
                        th:selected="${statusItem == selectedStatus}">
                </option>
            </select>
            <button type="submit" class="admin-btn admin-btn-primary">
                <i class="bi bi-search"></i>
                검색
            </button>
            <a th:href="@{/admin/reservations}" class="admin-btn admin-btn-secondary">초기화</a>
        </form>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>예약번호</th>
                    <th>회원 ID</th>
                    <th>디자이너</th>
                    <th>시술</th>
                    <th>예약일</th>
                    <th>예약시간</th>
                    <th>상태</th>
                    <th>결제금액</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(reservations)}">
                    <td colspan="8" style="text-align:center; padding:40px; color:#555;">조회된 예약이 없습니다.</td>
                </tr>
                <tr th:each="reservation : ${reservations}">
                    <td th:text="${reservation.reservationId}">1</td>
                    <td th:text="${reservation.memberId}">user1</td>
                    <td th:text="${reservation.designerName}">김하늘 점장</td>
                    <td th:text="${reservation.serviceName}">여성 커트</td>
                    <td th:text="${reservation.reservationDate}">2026-04-08</td>
                    <td th:text="${reservation.reservationTime}">10:00</td>
                    <td th:text="${reservation.status.name()}">COMPLETED</td>
                    <td th:text="${reservation.totalPrice}">50000</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
