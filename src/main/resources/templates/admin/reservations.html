<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
 <title>관리자 - 예약 관리</title>
</head>
<body>
<th:block layout:fragment="pageTitle">예약 관리</th:block>
<div layout:fragment="content">
 <div class="admin-card">
  <div class="admin-card-title">전체 예약 목록</div>
  <div class="admin-table-wrap">
   <table class="admin-table">
	<thead>
	<tr>
	 <th>ID</th>
	 <th>회원</th>
	 <th>디자이너</th>
	 <th>시술</th>
	 <th>예약일</th>
	 <th>결제금액</th>
	 <th>결제수단</th>
	 <th>상태</th>
	</tr>
	</thead>
	<tbody>
	<tr th:if="${#lists.isEmpty(reservations)}">
	 <td colspan="8" style="text-align:center; padding:40px; color:#555;">등록된 예약이 없습니다.</td>
	</tr>
	<tr th:each="reservation : ${reservations}">
	 <td th:text="${reservation.reservationId}">1</td>
	 <td th:text="${reservation.memberId}">user1</td>
	 <td th:text="${reservation.designerName}">디자이너</td>
	 <td th:text="${reservation.serviceName}">시술명</td>
	 <td th:text="${reservation.reservationDate + ' ' + reservation.reservationTime}">2026-04-07 13:30</td>
	 <td th:text="${#numbers.formatInteger(reservation.totalPrice, 3, 'COMMA') + '원'}">20,000원</td>
	 <td th:text="${reservation.paymentMethod != null and reservation.paymentMethod.name() == 'CARD' ? '카드': (reservation.paymentMethod != null and reservation.paymentMethod.name() == 'CASH' ? '현금': (reservation.paymentMethod != null and reservation.paymentMethod.name() == 'KAKAO_PAY' ? '카카오페이' : '네이버페이'))}">
	  카드
	 </td>
	 <td>
	  <span th:if="${reservation.status.name() == 'RESERVED'}" class="badge-active">예약완료</span>
	  <span th:if="${reservation.status.name() == 'COMPLETED'}" class="badge-notice">방문완료</span>
	  <span th:if="${reservation.status.name() == 'CANCELLED'}" class="badge-inactive">예약취소</span>
	 </td>
	</tr>
	</tbody>
   </table>
  </div>
 </div>
</div>
</body>
</html>
