<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>관리자 - 시술 관리</title>
</head>
<body>
<th:block layout:fragment="pageTitle">시술 관리</th:block>

<div layout:fragment="content">
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:16px;">
        <div class="admin-card">
            <div class="admin-card-title">등록 시술 수</div>
            <div style="font-size:28px; font-weight:700;" th:text="${totalServiceCount}">0</div>
        </div>
    </div>

    <div class="admin-card">
        <div class="admin-card-title">시술 목록</div>
        <div class="admin-action-row" style="margin-bottom:16px;">
            <a th:href="@{/salon-services/new}" class="admin-btn admin-btn-primary">
                <i class="bi bi-plus-lg"></i>
                신규 시술 등록
            </a>
        </div>

        <form class="admin-filter-wrap" th:action="@{/admin/salon-services}" method="get">
            <input type="text" name="keyword" class="admin-search-input" placeholder="시술명 검색" th:value="${search.keyword}">
            <input type="text" name="salonKeyword" class="admin-search-input" placeholder="매장명 검색" th:value="${search.salonKeyword}">
            <input type="number" name="maxPrice" class="admin-search-input" min="0" placeholder="최대 가격" th:value="${search.maxPrice}">
            <input type="number" name="maxDuration" class="admin-search-input" min="0" placeholder="최대 소요시간(분)" th:value="${search.maxDuration}">
            <button type="submit" class="admin-btn admin-btn-primary"><i class="bi bi-search"></i> 검색</button>
            <a th:href="@{/admin/salon-services}" class="admin-btn admin-btn-secondary">초기화</a>
        </form>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>시술명</th>
                    <th>매장</th>
                    <th>가격</th>
                    <th>소요시간</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(services)}">
                    <td colspan="6" style="text-align:center; padding:40px; color:#555;">조회된 시술이 없습니다.</td>
                </tr>
                <tr th:each="service : ${services}">
                    <td th:text="${service.serviceId}">1</td>
                    <td><a th:href="@{/salon-services/{id}(id=${service.serviceId})}" th:text="${service.name}">시술명</a></td>
                    <td th:text="${service.salonName}">매장명</td>
                    <td th:text="${service.price}">0</td>
                    <td th:text="${service.duration}">0</td>
                    <td style="display:flex; gap:8px; flex-wrap:wrap;">
                        <a th:href="@{/salon-services/{id}(id=${service.serviceId})}" class="admin-btn admin-btn-secondary"><i class="bi bi-box-arrow-up-right"></i> 상세</a>
                        <a th:href="@{/salon-services/{id}/edit(id=${service.serviceId})}" class="admin-btn admin-btn-secondary"><i class="bi bi-pencil"></i> 수정</a>
                        <form th:action="@{/salon-services/{id}/delete(id=${service.serviceId})}" method="post" onsubmit="return confirm('이 시술을 삭제하시겠습니까?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="admin-btn admin-btn-danger"><i class="bi bi-trash"></i> 삭제</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="admin-pagination" th:if="${servicePage != null and servicePage.totalPages > 1}">
            <a th:if="${previousGroupPage != null}" th:href="@{/admin/salon-services(page=${previousGroupPage}, keyword=${search.keyword}, salonKeyword=${search.salonKeyword}, maxPrice=${search.maxPrice}, maxDuration=${search.maxDuration})}" class="admin-page-link">이전</a>
            <a th:each="pageNumber : ${pageNumbers}" th:href="@{/admin/salon-services(page=${pageNumber}, keyword=${search.keyword}, salonKeyword=${search.salonKeyword}, maxPrice=${search.maxPrice}, maxDuration=${search.maxDuration})}" th:text="${pageNumber}" th:classappend="${pageNumber == currentPage} ? ' active'" class="admin-page-link">1</a>
            <a th:if="${nextGroupPage != null}" th:href="@{/admin/salon-services(page=${nextGroupPage}, keyword=${search.keyword}, salonKeyword=${search.salonKeyword}, maxPrice=${search.maxPrice}, maxDuration=${search.maxDuration})}" class="admin-page-link">다음</a>
        </div>
    </div>
</div>
</body>
</html>
