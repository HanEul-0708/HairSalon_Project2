<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::head}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>관리자 살롱 관리</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<main>
    <div class="container">
        <div class="page-header">
            <h1>살롱 관리</h1>
            <p>관리자 전용 살롱 목록입니다.</p>
        </div>

        <div class="page-actions">
            <a th:href="@{/salons/new}" class="btn btn-outline">살롱 등록</a>
            <a th:href="@{/admin/designers}" class="btn btn-outline">디자이너 관리</a>
            <a th:href="@{/admin/salon-services}" class="btn btn-outline">시술 관리</a>
        </div>

        <div class="admin-card">
            <div class="admin-card-title">살롱 목록</div>
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>이름</th>
                        <th>평점</th>
                        <th>리뷰</th>
                        <th>좋아요</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(salons)}">
                        <td colspan="5" style="text-align:center; padding:40px; color:#555;">조회된 살롱이 없습니다.</td>
                    </tr>
                    <tr th:each="salon : ${salons}">
                        <td th:text="${salon.salonId}">1</td>
                        <td><a th:href="@{/salons/{id}(id=${salon.salonId})}" th:text="${salon.name}">살롱명</a></td>
                        <td th:text="${salon.averageRating}">0</td>
                        <td th:text="${salon.reviewCount}">0</td>
                        <td th:text="${salon.likeCount}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
