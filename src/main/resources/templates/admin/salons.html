<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{admin/layout}">

<!--
  admin/salons.html — 미용실 관리 페이지
  =====================================================
  salonList    → 전체 미용실 목록
  totalCount   → 전체 미용실 수
  activeCount  → 운영 중 미용실 수
  currentMenu  → 'salons' (사이드바 활성화용)
-->

<head>
    <th:block layout:fragment="pageCss"></th:block>
</head>

<body>

<th:block layout:fragment="pageTitle">미용실 관리</th:block>

<div layout:fragment="content">

    <!-- 통계 카드 -->
    <div class="admin-stat-wrap">

        <div class="admin-stat-card">
            <span class="admin-stat-label">전체 미용실</span>
            <span class="admin-stat-value" th:text="${totalCount}">0</span>
            <i class="bi bi-scissors admin-stat-icon"></i>
        </div>

        <div class="admin-stat-card">
            <span class="admin-stat-label">운영 중</span>
            <span class="admin-stat-value" th:text="${activeCount}">0</span>
            <i class="bi bi-shop admin-stat-icon"></i>
        </div>

        <div class="admin-stat-card">
            <span class="admin-stat-label">운영 중단</span>
            <span class="admin-stat-value"
                  th:text="${totalCount - activeCount}">0</span>
            <i class="bi bi-shop-window admin-stat-icon"></i>
        </div>

        <div class="admin-stat-card">
            <span class="admin-stat-label">이달 신규 등록</span>
            <span class="admin-stat-value" th:text="${monthCount}">0</span>
            <i class="bi bi-plus-circle admin-stat-icon"></i>
        </div>

    </div>

    <!-- 미용실 목록 카드 -->
    <div class="admin-card">

        <div class="admin-card-title">전체 미용실 목록</div>

        <!-- 검색 / 필터 -->
        <form class="admin-filter-wrap" th:action="@{/admin/salons}" method="get">
            <select name="status" class="admin-select" onchange="this.form.submit()">
                <option value="">전체</option>
                <option value="ACTIVE"
                        th:selected="${selectedStatus == 'ACTIVE'}">운영 중</option>
                <option value="INACTIVE"
                        th:selected="${selectedStatus == 'INACTIVE'}">운영 중단</option>
            </select>
            <input type="text"
                   name="keyword"
                   class="admin-search-input"
                   th:value="${keyword}"
                   placeholder="미용실명 또는 지역으로 검색">
            <button type="submit" class="admin-btn admin-btn-primary">
                <i class="bi bi-search"></i> 검색
            </button>
        </form>

        <!-- 미용실 테이블 -->
        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>번호</th>
                    <th>미용실명</th>
                    <th>지역</th>
                    <th>전화번호</th>
                    <th>평점</th>
                    <th>리뷰 수</th>
                    <th>상태</th>
                    <th>등록일</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <!-- 미용실 없을 때 -->
                <tr th:if="${#lists.isEmpty(salonList)}">
                    <td colspan="9"
                        style="text-align:center; padding:40px; color:#555;">
                        등록된 미용실이 없습니다.
                    </td>
                </tr>

                <!-- 미용실 목록 반복 -->
                <tr th:each="salon : ${salonList}">
                    <td th:text="${salon.salonId}"></td>
                    <td>
                        <strong style="color:#fff;"
                                th:text="${salon.salonName}"></strong>
                    </td>
                    <td th:text="${salon.region}"></td>
                    <td th:text="${salon.phone}"></td>
                    <td>
                        <!-- 별점 표시 -->
                        <span style="color:#c9a84c;">★</span>
                        <span th:text="${#numbers.formatDecimal(salon.avgRating, 1, 1)}"></span>
                    </td>
                    <td th:text="${salon.reviewCount}"></td>
                    <td>
                            <span th:if="${salon.status == 'ACTIVE'}"
                                  class="badge-active">운영 중</span>
                        <span th:if="${salon.status == 'INACTIVE'}"
                              class="badge-inactive">운영 중단</span>
                    </td>
                    <td th:text="${#temporals.format(salon.createdAt, 'yyyy.MM.dd')}"></td>
                    <td>
                        <!-- 운영 상태 전환 버튼 -->
                        <form th:action="@{/admin/salons/{id}/status(id=${salon.salonId})}"
                              method="post"
                              style="display:inline">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">
                            <button type="submit"
                                    class="admin-btn admin-btn-secondary">
                                <i class="bi bi-arrow-repeat"></i>
                                <span th:text="${salon.status == 'ACTIVE'} ? '중단' : '재개'"></span>
                            </button>
                        </form>

                        <!-- 삭제 버튼 -->
                        <form th:action="@{/admin/salons/{id}/delete(id=${salon.salonId})}"
                              method="post"
                              style="display:inline"
                              onsubmit="return confirm('미용실을 삭제하시겠습니까?\n관련 예약 및 리뷰도 함께 삭제됩니다.')">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">
                            <button type="submit" class="admin-btn admin-btn-danger">
                                <i class="bi bi-trash"></i> 삭제
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

<th:block layout:fragment="pageJs">
    <script th:src="@{/js/admin.js}"></script>
</th:block>

</body>
</html>
